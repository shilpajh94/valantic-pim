#                    - UserOwner
#                roles:
        send_to_publish:
            templatePath: '/ConveyorBeltSolutions/WorkflowEmailTemplates/Product Publish Notification'
            notificationTo: 
                users:
                    - UserOwner   
                    # user owner is product creator means Product Manager
                roles:
#            notificationCC: 
#                users: 
#                    - ProductOwner
#                    - UserOwner
#                roles:
    
        publish_product:
            templatePath: '/ConveyorBeltSolutions/WorkflowEmailTemplates/Notification for Publish Product to PO'
            notificationTo: 
                users:
                    - ProductOwner
                roles:
#            notificationCC: 
#                users: 
#                    - ProductOwner
#                    - UserOwner

        pause_product:
            templatePath: '/ConveyorBeltSolutions/WorkflowEmailTemplates/Notification for Paused Product'
            notificationTo: 
                users:
                    - ProductOwner
                    - UserOwner
                roles:
                    - MarComCS
                    
#            notificationCC: 
#                users: 
#                    - ProductOwner
#                    - UserOwner
            action: 
                isPaused: true
                published: false
        archive_product:
            templatePath: '/ConveyorBeltSolutions/WorkflowEmailTemplates/Product Archive Notification'
            notificationTo: 
                users:
                    - ProductOwner
                    - UserOwner
                roles:
                    - MarComCS
            action: 
                isArchived: true
                published: false
            
    transition: 
        send_to_edit:
            action: 
                isPaused: false
            condition:
                
        approve_product:
            condition:
                methods: [checkForMandatoryValidation]
                
        pause_product:
            action: 
                isPaused: true
                published: false
            condition:
                
        archive_product:
            action: 
                isArchived: true
                published: false
            condition:
                methods: [checkIfChildsArchive]
        publish_product:
            action: 
                isPaused: false
                published: true
                
        archive_asset:
            action:
                path: '/Contitech_ConveyorSolution/Internal Assets'
        unarchive_asset:
            action:
                path: '/Contitech_ConveyorSolution/Product Assets/Unarchived'
        
    # Workflow reminder configuration
    # Places: Places is name of the Place which defined in workflow configuration in app/config.yml
    reminder:
        places:
            enrich:
                subject: 'Product Enrich'
                # If further action could not performed by recipent, then a reminder email will be send.
                reminderIntervalDay:
                    'First Reminder': 2
                    'Second Reminder': 4
                    'Final Reminder': 5
                # If User will take action till last reminder, then send reminder to BU Admin after specified days.
                reminderToBUAdminIntervalDay: [5]
                templatePath: '/Workflow/Email Template/productEnrichReminder'
            review_content:
                subject: 'Product Review'
                reminderIntervalDay:
                    'First Reminder': 2
                    'Second Reminder': 4
                    'Final Reminder': 5
                reminderToBUAdminIntervalDay: [5]
                templatePath: '/Workflow/Email Template/productReviewReminder'
            buAdminTemplatePath: '/Workflow/Email Template/productReminderBUAdmin'