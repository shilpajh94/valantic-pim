pimcore:
  workflows:
    product_approval:
      label: "Product Approval Workflow"
      type: state_machine
      marking_store:
        type: single_state
        arguments:
          - approvalState
      initial_markings: [!php/enum App\Enum\ProductManagement\UniProductManagementApprovalWorkflowPlace::CREATED->value]
      places:
        !php/enum App\Enum\ProductManagement\UniProductManagementApprovalWorkflowPlace::CREATED->value:
          label: 'Created from SAP'
          color: '#ffcc00'
          permissions:
            -
              condition: is_fully_authenticated() and ('ROLE_PIMCORE_ADMIN' in role_names)
              modify: true
            -
              condition: is_fully_authenticated() and ('ROLE_UNIADMIN' in role_names or 'ROLE_UNIENRICHMENT' in role_names)
              unpublish: false
              delete: false
              view: true
              publish: false
              save: true
            -
              unpublish: false
              delete: false
              view: true
              publish: false
              save: false
        !php/enum App\Enum\ProductManagement\UniProductManagementApprovalWorkflowPlace::PENDING_APPROVAL->value:
          label: 'Pending Approval'
          color: '#ffa500'
          permissions:
            -
              condition: is_fully_authenticated() and ('ROLE_PIMCORE_ADMIN' in role_names)
              modify: true
            -
              condition: is_fully_authenticated() and 'ROLE_UNIADMIN' in role_names
              unpublish: false
              delete: false
              view: true
              publish: false
              save: true
            -
              condition: is_fully_authenticated() and ('ROLE_UNIAPPROVALPTS' in role_names or 'ROLE_UNIAPPROVALDSS' in role_names or 'ROLE_UNIAPPROVALFHS' in role_names)
              unpublish: false
              delete: true
              view: true
              publish: false
              save: true
            -
              unpublish: false
              delete: false
              view: true
              publish: false
              save: false
        !php/enum App\Enum\ProductManagement\UniProductManagementApprovalWorkflowPlace::APPROVED->value:
          label: 'Approved'
          color: '#00cc00'
          permissions:
            -
              condition: is_fully_authenticated() and ('ROLE_PIMCORE_ADMIN' in role_names)
              modify: true
            -
              condition: is_fully_authenticated() and ('ROLE_UNIADMIN' in role_names or 'ROLE_UNIENRICHMENT' in role_names)
              unpublish: false
              delete: false
              view: true
              publish: false
              save: true
            -
              unpublish: false
              delete: false
              view: true
              publish: false
              save: false
        !php/enum App\Enum\ProductManagement\UniProductManagementApprovalWorkflowPlace::REJECTED->value:
          label: 'Rejected'
          color: '#e74c3c'
          permissions:
            -
              condition: is_fully_authenticated() and ('ROLE_PIMCORE_ADMIN' in role_names)
              modify: true
            -
              condition: is_fully_authenticated() and ('ROLE_UNIADMIN' in role_names or 'ROLE_UNIENRICHMENT' in role_names)
              unpublish: false
              delete: false
              view: true
              publish: false
              save: true
            -
              unpublish: false
              delete: false
              view: true
              publish: false
              save: false
        !php/enum App\Enum\ProductManagement\UniProductManagementApprovalWorkflowPlace::DRAFT->value:
          label: 'Draft'
          color: '#ffd700'
          permissions:
            -
              condition: is_fully_authenticated() and ('ROLE_PIMCORE_ADMIN' in role_names)
              modify: true
            -
              condition: is_fully_authenticated() and ('ROLE_UNIADMIN' in role_names or 'ROLE_UNIENRICHMENT' in role_names)
              unpublish: false
              delete: false
              view: true
              publish: false
              save: true
            -
              unpublish: false
              delete: false
              view: true
              publish: false
              save: false
        !php/enum App\Enum\ProductManagement\UniProductManagementApprovalWorkflowPlace::ARCHIVED->value:
          label: 'Archived'
          color: '#808080'
          permissions:
            -
              condition: is_fully_authenticated() and ('ROLE_PIMCORE_ADMIN' in role_names)
              modify: true
            -
              condition: is_fully_authenticated() and 'ROLE_UNIADMIN' in role_names
              unpublish: false
              delete: true
              view: true
              publish: false
              save: false
            -
              unpublish: false
              delete: false
              view: true
              publish: false
              save: false
        !php/enum App\Enum\ProductManagement\UniProductManagementApprovalWorkflowPlace::EMERGENCY_UNPUBLISHED->value:
          label: 'Emergency Unpublished'
          color: '#c0392b'
          permissions:
            -
              condition: is_fully_authenticated() and ('ROLE_PIMCORE_ADMIN' in role_names)
              modify: true
            -
              condition: is_fully_authenticated() and ('ROLE_UNIADMIN' in role_names or 'ROLE_UNIENRICHMENT' in role_names)
              unpublish: false
              delete: false
              view: true
              publish: false
              save: true
            -
              unpublish: false
              delete: false
              view: true
              publish: false
              save: false
      transitions:
        !php/enum App\Enum\ProductManagement\UniProductManagementApprovalWorkflowTransition::SUBMIT_FOR_APPROVAL->value:
          guard: "is_fully_authenticated() and ('ROLE_UNIADMIN' in role_names or 'ROLE_UNIENRICHMENT' in role_names)"
          from:
            - !php/enum App\Enum\ProductManagement\UniProductManagementApprovalWorkflowPlace::CREATED->value
            - !php/enum App\Enum\ProductManagement\UniProductManagementApprovalWorkflowPlace::REJECTED->value
            - !php/enum App\Enum\ProductManagement\UniProductManagementApprovalWorkflowPlace::DRAFT->value
            - !php/enum App\Enum\ProductManagement\UniProductManagementApprovalWorkflowPlace::EMERGENCY_UNPUBLISHED->value
          to: !php/enum App\Enum\ProductManagement\UniProductManagementApprovalWorkflowPlace::PENDING_APPROVAL->value
          options:
            label: 'Submit for Approval'
            changePublishedState: 'no_change'
            iconClass: 'pimcore_icon_right'
        !php/enum App\Enum\ProductManagement\UniProductManagementApprovalWorkflowTransition::REJECT->value:
          guard: "is_fully_authenticated() and ('ROLE_UNIADMIN' in role_names or 'ROLE_UNIAPPROVALPTS' in role_names or 'ROLE_UNIAPPROVALDSS' in role_names or 'ROLE_UNIAPPROVALFHS' in role_names)"
          from: !php/enum App\Enum\ProductManagement\UniProductManagementApprovalWorkflowPlace::PENDING_APPROVAL->value
          to: !php/enum App\Enum\ProductManagement\UniProductManagementApprovalWorkflowPlace::REJECTED->value
          options:
            label: 'Reject Product'
            notes:
              title: 'Reason for rejection'
              commentEnabled: true
              commentRequired: true
            changePublishedState: 'no_change'
            iconClass: 'pimcore_icon_minus'
        !php/enum App\Enum\ProductManagement\UniProductManagementApprovalWorkflowTransition::APPROVE->value:
          guard: "is_fully_authenticated() and ('ROLE_UNIADMIN' in role_names or 'ROLE_UNIAPPROVALPTS' in role_names or 'ROLE_UNIAPPROVALDSS' in role_names or 'ROLE_UNIAPPROVALFHS' in role_names)"
          from: !php/enum App\Enum\ProductManagement\UniProductManagementApprovalWorkflowPlace::PENDING_APPROVAL->value
          to: !php/enum App\Enum\ProductManagement\UniProductManagementApprovalWorkflowPlace::APPROVED->value
          options:
            label: 'Approve Product'
            notes:
              title: 'Approval notes'
              commentEnabled: true
              commentRequired: false
            changePublishedState: 'force_published'
            iconClass: 'pimcore_icon_accept'
        !php/enum App\Enum\ProductManagement\UniProductManagementApprovalWorkflowTransition::EDIT_DRAFT->value:
          guard: "is_fully_authenticated() and ('ROLE_UNIADMIN' in role_names or 'ROLE_UNIENRICHMENT' in role_names)"
          from: !php/enum App\Enum\ProductManagement\UniProductManagementApprovalWorkflowPlace::APPROVED->value
          to: !php/enum App\Enum\ProductManagement\UniProductManagementApprovalWorkflowPlace::DRAFT->value
          options:
            label: 'Edit Draft'
            changePublishedState: 'no_change'
            iconClass: 'pimcore_icon_edit'
        !php/enum App\Enum\ProductManagement\UniProductManagementApprovalWorkflowTransition::ARCHIVE->value:
          guard: "is_fully_authenticated() and 'ROLE_UNIADMIN' in role_names"
          from:
            - !php/enum App\Enum\ProductManagement\UniProductManagementApprovalWorkflowPlace::PENDING_APPROVAL->value
            - !php/enum App\Enum\ProductManagement\UniProductManagementApprovalWorkflowPlace::REJECTED->value
            - !php/enum App\Enum\ProductManagement\UniProductManagementApprovalWorkflowPlace::APPROVED->value
            - !php/enum App\Enum\ProductManagement\UniProductManagementApprovalWorkflowPlace::DRAFT->value
          to: !php/enum App\Enum\ProductManagement\UniProductManagementApprovalWorkflowPlace::ARCHIVED->value
          options:
            label: 'Archive Product'
            notes:
              title: 'Archive notes'
              commentEnabled: true
              commentRequired: false
            changePublishedState: 'force_unpublished'
            iconClass: 'pimcore_icon_delete'
        !php/enum App\Enum\ProductManagement\UniProductManagementApprovalWorkflowTransition::UNARCHIVE->value:
          guard: "is_fully_authenticated() and 'ROLE_UNIADMIN' in role_names"
          from: !php/enum App\Enum\ProductManagement\UniProductManagementApprovalWorkflowPlace::ARCHIVED->value
          to: !php/enum App\Enum\ProductManagement\UniProductManagementApprovalWorkflowPlace::DRAFT->value
          options:
            label: 'Unarchive Product'
            changePublishedState: 'no_change'
            iconClass: 'pimcore_icon_revert'
        !php/enum App\Enum\ProductManagement\UniProductManagementApprovalWorkflowTransition::EMERGENCY_UNPUBLISH->value:
          guard: "is_fully_authenticated() and 'ROLE_UNIADMIN' in role_names"
          from: [!php/enum App\Enum\ProductManagement\UniProductManagementApprovalWorkflowPlace::APPROVED->value, !php/enum App\Enum\ProductManagement\UniProductManagementApprovalWorkflowPlace::DRAFT->value]
          to: !php/enum App\Enum\ProductManagement\UniProductManagementApprovalWorkflowPlace::EMERGENCY_UNPUBLISHED->value
          options:
            label: 'Emergency Unpublish'
            notes:
              title: 'Reason for emergency unpublish'
              commentEnabled: true
              commentRequired: false
            changePublishedState: 'force_unpublished'
            iconClass: 'pimcore_icon_warning'
      supports:
        - 'Pimcore\Model\DataObject\UniProductBase'
