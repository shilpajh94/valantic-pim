services:
    # default configuration for services in *this* file
    _defaults:
        # automatically injects dependencies in your services
        autowire: true
        # automatically registers your services as commands, event subscribers, etc.
        autoconfigure: true
        # this means you cannot fetch services directly from the container via $container->get()
        # if you need to do this, you can override this setting on individual services
        public: false

    # controllers are imported separately to make sure they're public
    # and have a tag that allows actions to type-hint services
    IFSEU\ProductBundle\Controller\:
        resource: '../src/Controller'
        public: true
        tags: ['controller.service_arguments']

# add more services, or override services that need manual wiring
#    IFSEU\ProductBundle\ExampleClass:
#        arguments:
#            - "@service_id"
#            - "plain_value"
#            - "%parameter%"

    # Event Listener 
    IFSEU\ProductBundle\EventListeners\ObjectsListener:
        tags:
            - { name: kernel.event_listener, event: pimcore.dataobject.preUpdate, method: preUpdate }

    IFSEU\ProductBundle\Workflow\IFSEUProductEnrichmentListener:
        tags:
            - { name: kernel.event_listener, event: workflow.ifs_eu_product_enrichment.completed, method: ifsEuWorkflowNotification }
            - { name: kernel.event_listener, event: workflow.ifs_eu_product_enrichment.transition, method: ifsEuWorkflowActions }

    Pimcore\Bundle\AdminBundle\Controller\Admin\DataObject\ClassController:
        class: IFSEU\ProductBundle\Controller\ClassController

    IFSEU\ImportBundle\Services\ConfigProviderService:
        public: true

    IFSEU\ProductBundle\Services\CompletenessPercentageService:
        class: IFSEU\ProductBundle\Services\CompletenessPercentageService
        public: true
        autowire: true

    IFSEU\ProductBundle\Services\IFSEUMandatoryValidationService:
        class: IFSEU\ProductBundle\Services\IFSEUMandatoryValidationService
        public: true
