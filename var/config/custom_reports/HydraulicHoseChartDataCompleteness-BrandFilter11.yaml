pimcore_custom_reports:
    definitions:
        HydraulicHoseChartDataCompleteness-BrandFilter11:
            name: HydraulicHoseChartDataCompleteness-BrandFilter11
            sql: ''
            dataSourceConfig:
                -
                    sql: "SELECT\n  sum(temp.nSKU) AS `# of Sku's`,\n  Round(sum(temp.percentage),2) AS `Completeness Percentage`,\n  temp.SIOP3 AS `SIOP3`,\n  temp.`BrandType`"
                    from: "FROM\n  (\n    SELECT\n      CASE WHEN brand.`BrandType` IS NULL THEN 'Empty' WHEN brand.`BrandType` =\"\" THEN 'Empty' WHEN brand.`BrandType` = \"General\" THEN 'General' WHEN brand.`BrandType` = \"Generic\" THEN 'Generic' WHEN brand.`BrandType` = \"Private\" THEN 'Private' END AS `BrandType`,\n      COUNT(o1.`key`) AS `nSKU`,\n      (\n        ROUND(\n          (\n            SUM(en.CompletenessPercentage) / COUNT(o1.`key`)\n          ),\n          3\n        )\n      ) AS `percentage`,\n      cat3.`description` AS `SIOP3`\n    FROM\n      object_1 o1\n      LEFT JOIN object_3 brand on brand.oo_id = o1.brandName\n      LEFT JOIN `object_localized_query_1_en` en ON `en`.`ooo_id` = `o1`.`id`\n      LEFT JOIN object_localized_query_2_en cat3 ON cat3.ooo_id = SUBSTRING(o1.SIOPLevel3, 2, (LENGTH(o1.SIOPLevel3) -2))\n    WHERE\n      (\n        o1.`published` = 1\n        AND (o1.siopFullCode LIKE '0415001540%' OR o1.siopFullCode LIKE '0415001550%' OR o1.siopFullCode LIKE '0415001560%' OR o1.siopFullCode LIKE '0415001530000%' OR o1.siopFullCode LIKE '0415001510000%')\n      ) GROUP BY\n      cat3.`description`,\n      brand.`BrandType`\n    ORDER BY\n      cat3.`description`\n  ) temp\n"
                    where: ''
                    groupby: "Group BY temp.BrandType,\ntemp.`SIOP3`"
                    type: sql
            columnConfiguration:
                -
                    name: "# of Sku's"
                    display: true
                    export: true
                    order: true
                    width: ''
                    label: ''
                    id: extModel1211-1
                -
                    name: 'Completeness Percentage'
                    display: true
                    export: true
                    order: true
                    width: ''
                    label: ''
                    id: extModel1211-2
                -
                    name: SIOP3
                    display: true
                    export: true
                    order: true
                    width: ''
                    label: ''
                    id: extModel1211-3
                -
                    name: BrandType
                    display: true
                    export: true
                    order: true
                    width: ''
                    label: ''
                    id: extModel1211-4
            niceName: 'Chart - Data Completeness - BrandType Filter 11'
            group: 'Hydraulic Hose'
            groupIconClass: ''
            iconClass: ''
            menuShortcut: false
            reportClass: ''
            chartType: bar
            pieColumn: null
            pieLabelColumn: null
            xAxis: SIOP3
            yAxis:
                - 'Completeness Percentage'
            modificationDate: 1708254341
            creationDate: 1708254215
            shareGlobally: true
            sharedUserNames: {  }
            sharedRoleNames: {  }
