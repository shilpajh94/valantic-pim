services:
    # default configuration for services in *this* file
    _defaults:
        # automatically injects dependencies in your services
        autowire: true
        # automatically registers your services as commands, event subscribers, etc.
        autoconfigure: true
        # this means you cannot fetch services directly from the container via $container->get()
        # if you need to do this, you can override this setting on individual services
        public: false

    # controllers are imported separately to make sure they're public
    # and have a tag that allows actions to type-hint services
    PTGEU\ImportBundle\Controller\:
        resource: '../src/Controller'
        public: true
        tags: ['controller.service_arguments']

# add more services, or override services that need manual wiring
#    PTGEU\ImportBundle\ExampleClass:
#        arguments:
#            - "@service_id"
#            - "plain_value"
#            - "%parameter%"
    
    # Commands
    # this command will execute the import of SAP product
    PTGEU\ImportBundle\Command\SAPProductImportCommand:
        tags:
            - { name: 'console.command', command: 'contitech:ptg:eu:sap-product-import' }

    # this command will execute the import of SAP plant material
    PTGEU\ImportBundle\Command\SAPPlantMaterialImportCommand:
        tags:
            - { name: 'console.command', command: 'contitech:ptg:eu:sap-plant-material-import' }
    
    # this command will execute the import of SAP sales material
    PTGEU\ImportBundle\Command\SAPSalesMaterialImportCommand:
        tags:
            - { name: 'console.command', command: 'contitech:ptg:eu:sap-sales-material-import' }

    # this command will execute the onetime import of product hierarchy
    PTGEU\ImportBundle\OneTimeImportCommand\PTGEUProductHierarchyImportCommand:
        tags:
            - { name: 'console.command', command: 'contitech:ptg:eu:one-time-import:product-hierarchy-import' }

    # this command will execute to modify the state of workflow to published state
    PTGEU\ImportBundle\OneTimeImportCommand\PTGEUWorkflowPublishCommand:
        tags:
            - { name: 'console.command', command: 'ptgeu-workflow-publish' }

    # this command will execute the onetime import of product hierarchy
    PTGEU\ImportBundle\OneTimeImportCommand\PTGEUProductAssetImportCommand:
        tags:
            - { name: 'console.command', command: 'contitech:ptg:eu:one-time-import:product-asset-import' }

    # this command will execute the onetime import of product editable attributes
    PTGEU\ImportBundle\OneTimeImportCommand\PTGEUProductEditableAttributesImportCommand:
        tags:
            - { name: 'console.command', command: 'contitech:ptg:eu:one-time-import:product-editable-attributes-import' }

    # this command will execute the SAP price import
    PTGEU\ImportBundle\Command\SAPPriceImportCommand:
        tags:
            - { name: 'console.command', command: 'contitech:ptg:eu:sap-price-import' }

    # this command will execute the SAP editables import
    PTGEU\ImportBundle\Command\SAPEditablesImportCommand:
        tags:
            - { name: 'console.command', command: 'contitech:ptg:eu:sap-editables-import' }
    
    # this command will delete files older than 30 days
    PTGEU\ImportBundle\Command\DeleteOlderPTGEUSAPFileCommand:
        tags:
            - { name: 'console.command', command: 'contitech:delete_older_ptgeu_sap_files' }

    # this command will move older files to S3
    PTGEU\ImportBundle\Command\MovePTGEUSAPFileToS3Command:
        tags:
            - { name: 'console.command', command: 'contitech:move_ptgeu_sap_file_to_s3' }
    
    PTGEU\ImportBundle\OneTimeImportCommand\PTGEUDeleteCommand:
        tags:
            - { name: 'console.command', command: 'contitech:ptg:eu:delete' }
    
    PTGEU\ImportBundle\OneTimeImportCommand\PTGEUPulleysToDataImportCommand:
        tags:
            - { name: 'console.command', command: 'ptgeu-pulleysTo-data-import-command' }
    
    # this command will execute to save and publish ptgeu products
    PTGEU\ImportBundle\OneTimeImportCommand\PTGEUProductSaveAndPublishCommand:
        tags:
            - { name: 'console.command', command: 'contitech:ptg:eu:product-save_publish' }

    # this command will execute to map skeleton brick and import it's data
    PTGEU\ImportBundle\OneTimeImportCommand\PTGEUSkeletonBrickMappingAndDataImport:
        tags:
            - { name: 'console.command', command: 'ptgeu-skeletonBrickMapping-and-dataImport' }

    # this command will execute to import width attribute data in commonFert brick
    PTGEU\ImportBundle\OneTimeImportCommand\PTGEUWidthAttributeDataImportCommand:
        tags:
            - { name: 'console.command', command: 'ptgeu-widthAttribute-dataImport' }
        
    # this command will execute to map polyVFert brick and import it's data
    PTGEU\ImportBundle\OneTimeImportCommand\PTGEUPolyVFertBrickMappingAndDataImport:
        tags:
            - { name: 'console.command', command: 'ptgeu-polyVFertBrickMapping-and-dataImport' }

    # this command will execute to save and publish ptgeu products
    PTGEU\ImportBundle\OneTimeImportCommand\PTGEUSaveAndPublishCommand:
        tags:
            - { name: 'console.command', command: 'contitech:ptg:eu:save' }

    # this command will copy sap description data to blank product short description attributes
    PTGEU\ImportBundle\Command\PTGEUCopySapDescriptionIntoProductShortDescriptionCommand:
        tags:
            - { name: 'console.command', command: 'contitech:ptg:eu:copy-sapDescription-into-productShortDescription' }

    # this command will execute to map ptgeu dropdown brick data
    PTGEU\ImportBundle\OneTimeImportCommand\ImportDropDownDataCommand:
        tags:
            - { name: 'console.command', command: 'ptgeu:dropdown-data-import' }

    # this command will execute to map commonFert brick and import it's data
    PTGEU\ImportBundle\OneTimeImportCommand\PTGEUCommonFertBrickMappingAndDataImport:
        tags:
            - { name: 'console.command', command: 'ptgeu-CommonFertBrickMapping-and-dataImport' }

    # this command will execute to map VBeltsFert brick and import it's data
    PTGEU\ImportBundle\OneTimeImportCommand\PTGEUVBeltsFertBrickMappingAndDataImport:
        tags:
            - { name: 'console.command', command: 'ptgeu-VBeltsFertBrickMapping-and-dataImport' }

    # Services
    import.sap_file_feeder_service:
        class: PTGEU\ImportBundle\Services\SAPFileFeederService
        public: true

    import.sap_product_service:
        class: PTGEU\ImportBundle\Services\ProductService
        public: true

    import.sap_plant_material_import:
        class: PTGEU\ImportBundle\Services\PlantMaterialService
        public: true

    import.sap_product_asset_service:
        class: PTGEU\ImportBundle\Services\ProductAssetMappingService
        public: true

    # Helpers
    import.common_helper:
        class: PTGEU\ImportBundle\Helper\Common
        public: true
    
    import.sap_sales_material_import:
        class: PTGEU\ImportBundle\Services\SalesMaterialService
        public: true
        
    import.category_helper:
        class: PTGEU\ImportBundle\Helper\Category
        public: true

    import.config_provider_service:
        class: PTGEU\ImportBundle\Services\ConfigProviderService
        public: true

    import.category_brick_mapping_service:
        class:  PTGEU\ImportBundle\Services\CategoryBrickMappingService
        public: true
    
    import.sap_category_service:
        class:  PTGEU\ImportBundle\Services\CategoryService
        public: true
    
    import.ptgeu_category_validator_service:
        class: PTGEU\ImportBundle\Services\Validator\Category
        public: true

    import.product_helper:
        class: PTGEU\ImportBundle\Helper\Product
        public: true

    import.sap_price_service:
        class: PTGEU\ImportBundle\Services\PriceService
        public: true

    import.editables_service:
        class: PTGEU\ImportBundle\Services\EditablesService
        public: true