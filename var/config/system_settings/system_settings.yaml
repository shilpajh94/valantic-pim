pimcore:
    config_location:
        system_settings:
            write_target:
                type: 'settings-store'
            read_target:
                type: 'settings-store'
    general:
        domain: ''
        redirect_to_maindomain: false
        language: en
        valid_languages: 'en,de,pt,fr,zh,es,ro,en_GB,ru,pl,it,da,fi,nl,nn_NO,sv_SE'
        fallback_languages:
            en: ''
            de: ''
            pt: ''
            fr: ''
            zh: ''
            es: ''
            ro: ''
            en_GB: ''
            ru: ''
            pl: ''
            it: ''
            da: ''
            fi: ''
            nl: ''
            nn_NO: ''
            sv_SE: ''
        default_language: en
        debug_admin_translations: false
    documents:
        versions:
            days: null
            steps: null
        error_pages:
            default: ''
            localized:
                en: ''
    objects:
        versions:
            days: null
            steps: null
