        Troughability Minimum Belt Width:
            TableComment: "If the top cover and pulley cover are of equal gauge or less than 1/16\" in diferential, to ensure the belt will trough properly, add 6\" to the minimum recommended belt width. For belts with
                            balanced covers, the minimum recommended width for trough-ability is possible provided the belt is run fully loaded for an extended period which will force the belt down into the systems trough
                            configuration. Consult your Sales Representative. Additional break-in time is required when the belt has been stored prior to installation in ambient temperatures of less than 50°F (10°C). "
