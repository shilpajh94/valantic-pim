pimcore:
    workflows:
        cs_asset_workflow:
            label: "Asset Archiving Workflow"
            type: "state_machine"
            initial_markings:     ["default"]
#            supports:
#                - 'Pimcore\Model\Asset'
            support_strategy:
            #    service: ContitechCS\ProductBundle\Workflow\AssetSupportStrategy
    

                # Define a custom service to handle the logic. Take a look at the Symfony docs for more details.
#                service:
            places:
                default:
                    label: Default
                    color: #377ea9
#                    visibleInHeader: false
                archived:
                    label: Archived
                    color: #377ea9
#                    visibleInHeader: false
            transitions:
                archive_asset:
                    from:
                        - default
                    to: archived
                    guard: (("ROLE_PIMCORE_ADMIN") in role_names or ("ROLE_PIMCORE_APPLICATIONADMINCS") in role_names or ("ROLE_MARCOMCS") in role_names)
                    options:
                        label: 'Archive Asset'
                        notes:
                            commentEnabled: true
                            commentRequired: true
                        changePublishedState: no_change                                               
                unarchive_asset:
                    from:
                        - archived
                    to: default
                    guard: (("ROLE_PIMCORE_ADMIN") in role_names or ("ROLE_PIMCORE_APPLICATIONADMINCS") in role_names or ("ROLE_MARCOMCS") in role_names)
                    options:
                        label: 'UnArchive Asset'
                        notes:
                            commentEnabled: true
                            commentRequired: true
                        changePublishedState: no_change