imports:
    - { resource: parameters.yml }
    - { resource: security.yml }
    - { resource: services.yml }
    - { resource: 'local/' }

pimcore:
    workflows:
        workflow:
            label: 'Product Workflow'
            type: 'state_machine'
            supports:
            - 'Pimcore\Model\DataObject\Product'
            places:
                enrich:
                    label: 'Enrich product'
                    color: '#377ea9'
                    permissions:
                        - objectLayout: 5
                review_content:
                    label: 'Review Enriched Data'
                    title: 'Review Product'
                    color: '#d9ef36'
                    permissions:
                        - objectLayout: 6           
                content_prepared:
                    label: 'Content Prepared'
                    title: 'Content ready to publish'
                    color: '#28a013'
                accepted:
                    label: 'Accepted product'
                    color: '#28a013'
            transitions:
                enrich_again:
                    from: [enrich, review_content]
                    to: enrich
                    options:
                        label: 'Send back to enrich again'
                        notes:
                            commentEnabled: true
                            commentRequired: true
                start_processing:
                    from: [enrich]
                    to: review_content
                    options:
                        label: 'Start processing the product'
                        notes:
                            commentEnabled: true
                            commentRequired: false
                content_ready:
                    from: review_content
                    to: content_prepared
                    options:
                        label: 'Content is ready to publish'
                publish:
                    from: content_prepared
                    to: accepted
                    guard: "is_fully_authenticated() and has_role('ROLE_PIMCORE_SUPERUSER')"
                    options:
                        label: 'Publish the product'

