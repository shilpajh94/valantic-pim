parameters:
    s3.bucket: '%env(resolve:S3_BUCKET)%'

services:
    assets_s3:
        class: 'Aws\S3\S3Client'
        arguments:
            -  endpoint: '%env(resolve:S3_HOST)%'
               region: '%env(resolve:S3_REGION)%'
               version: 'latest'
flysystem:
    storages:
        pimcore.asset.storage:
            adapter: 'S3CustomizationBundle\Lib\AwsCustomAdapter'
            visibility: private
            options:
                client: 'assets_s3'
                bucket: '%env(resolve:S3_BUCKET)%'
                prefix: assets
