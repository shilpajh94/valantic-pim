pimcore:
    workflows:
        product_publishing:
            label: 'Product Workflow'
            type: 'state_machine'
#            audit_trail:
#                enabled: true
            supports:
            - 'Pimcore\Model\DataObject\Product'
            places:
                enrich:
                    label: 'Enrich product'
                    color: '#377ea9'
                review_content:
                    label: 'Review Enriched Data'
                    title: 'Review Product'
                    color: '#d9ef36'
#                    permissions:
#                        - objectLayout: 6
                accepted:
                    label: 'Product Published'
                    color: '#28a013'
                unpublished:
                    label: 'Product Unpublished'
                    color: '#f70a0a'
            transitions:
                enrich_again:
                    from: [review_content]
                    to: enrich
                    guard: "is_fully_authenticated() and ('ROLE_PRODUCTMANAGER' in role_names or 'ROLE_APPLICATIONADMIN' in role_name)"
                    # notificationSettings:
                    #     notifyRoles: ['ROLE_EDITOR']
                    #     mailPath: '@PimcoreCore/Workflow/NotificationEmail/notificationEmail.html.twig'
                    options:
                        label: 'Send back to enrich again'
                        
                        changePublishedState: "save_version"
                        notes:
                            commentEnabled: true
                            commentRequired: true
                            additionalFields:
                                -
                                    name: 'priority'
                                    title: 'Set Priority'
                                    fieldType: 'select'
                                    fieldTypeSettings:
                                        options:
                                            -
                                                key: 'Normal'
                                                value: 'normal'
                                            -
                                                key: 'High'
                                                value: 'high'
                        
                start_processing:
                    from: [enrich]
                    to: review_content
                    guard: "is_fully_authenticated() and ('ROLE_EDITOR' in role_names)"
                    # iconClass: '/bundles/pimcoreadmin/img/flat-color-icons/email.svg'
                    # notificationSettings:
                    #     notifyRoles: ['ROLE_PRODUCTMANAGER']
                    #     mailPath: '@PimcoreCore/Workflow/NotificationEmail/notificationEmail.html.twig'
                    options:
                        label: 'Product Enriched'
                        changePublishedState: "save_version"
                        notes:
                            commentEnabled: true
                            commentRequired: true
                            additionalFields:
                                -
                                    name: 'priority'
                                    title: 'Set Priority'
                                    fieldType: 'select'
                                    fieldTypeSettings:
                                        options:
                                            -
                                                key: 'Normal'
                                                value: 'normal'
                                            -
                                                key: 'High'
                                                value: 'high'
                        
                publish:
                    from: [review_content, unpublished]
                    to: [accepted]
                    guard: "is_fully_authenticated() and ('ROLE_PRODUCTMANAGER' in role_names or 'ROLE_APPLICATIONADMIN' in role_names)"
                    # notificationSettings:
                    #     notifyRoles: ['ROLE_PRODUCTMANAGER']
                    #     mailPath: '@PimcoreCore/Workflow/NotificationEmail/notificationEmail.html.twig'
                    options:
                        label: 'Publish the product'
                        changePublishedState: "force_published"
                        notes:
                            commentEnabled:       true
                            commentRequired:      true
                            
                unpublish:
                    from: [enrich, review_content, accepted]
                    to: unpublished
                    guard: "is_fully_authenticated() and ('ROLE_PRODUCTMANAGER' in role_names or 'ROLE_APPLICATIONADMIN' in role_names)"
                    # notificationSettings:
                    #     notifyRoles: ['ROLE_PRODUCTMANAGER']
                    #     mailPath: '@PimcoreCore/Workflow/NotificationEmail/notificationEmail.html.twig'
                    options:
                        label: 'Unpublish the product'
                        changePublishedState: "force_unpublished"
                        notes:
                            commentEnabled:       true
                            commentRequired:      true
                        
                reopen:
                    from: [accepted]
                    to: enrich
                    guard: "is_fully_authenticated() and ('ROLE_PRODUCTMANAGER' in role_names or 'ROLE_APPLICATIONADMIN' in role_names)"
                    options:
                        changePublishedState: "no_change"
                        label: 'Product open to enrich'
                        notes:
                            commentEnabled:       true
                            commentRequired:      true
                            additionalFields:
                                -
                                    name: 'priority'
                                    title: 'Set Priority'
                                    fieldType: 'select'
                                    fieldTypeSettings:
                                        options:
                                            -
                                                key: 'Normal'
                                                value: 'normal'
                                            -
                                                key: 'High'
                                                value: 'high'
