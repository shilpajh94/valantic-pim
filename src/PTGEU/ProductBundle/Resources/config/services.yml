services:
    # default configuration for services in *this* file
    _defaults:
        # automatically injects dependencies in your services
        autowire: true
        # automatically registers your services as commands, event subscribers, etc.
        autoconfigure: true
        # this means you cannot fetch services directly from the container via $container->get()
        # if you need to do this, you can override this setting on individual services
        public: false

    # controllers are imported separately to make sure they're public
    # and have a tag that allows actions to type-hint services
    PTGEU\ProductBundle\Controller\:
        resource: '../../Controller'
        public: true
        tags: ['controller.service_arguments']

# add more services, or override services that need manual wiring
#    PTGEU\ProductBundle\ExampleClass:
#        arguments:
#            - "@service_id"
#            - "plain_value"
#            - "%parameter%"
    PTGEU\ProductBundle\Workflow\PTGEUProductEnrichmentListener:
        tags:
            - { name: kernel.event_listener, event: workflow.ptg_eu_product_enrichment.completed, method: ptgEuWorkflowNotification }
            - { name: kernel.event_listener, event: workflow.ptg_eu_product_enrichment.transition, method: ptgEuWorkflowActions }
    
    PTGEU\ProductBundle\EventListeners\ObjectsListener:
        tags:
            - { name: kernel.event_listener, event: pimcore.dataobject.preUpdate, method: preUpdate }

    PTGEU\ProductBundle\Services\CompletenessPercentageService:
        class: PTGEU\ProductBundle\Services\CompletenessPercentageService
        public: true
        autowire: true
    PTGEU\ProductBundle\Services\PTGEUMandatoryValidationService:
        class: PTGEU\ProductBundle\Services\PTGEUMandatoryValidationService
        public: true