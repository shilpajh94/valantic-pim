parameters:
    s3.bucket: 'pimcorex-contitech-assets-prod-latest'

services:
    assets_s3:
        class: 'Aws\S3\S3Client'
        arguments:
            -  endpoint: 'https://s3.eu-central-1.amazonaws.com'
               region: 'eu-central-1'
               version: 'latest'
flysystem:
    storages:
        pimcore.asset.storage:
            adapter: 'S3CustomizationBundle\Lib\AwsCustomAdapter'
            visibility: private
            options:
                client: 'assets_s3'
                bucket: 'pimcorex-contitech-assets-prod-latest'
                prefix: assets







