#### SYMFONY OVERRIDES
framework:
    profiler:
        enabled: false
    mailer:
        transports:
            main: '%env(SMTP_MAIL_CONFIG)%'
            pimcore_newsletter: '%env(SMTP_PIMCORE_NEWSLETTER)%'


#### USE SESSION HANDLER CONFIGURED IN php.ini
#    session:
#        handler_id: null
    cache:
        pools:
            pimcore.cache.pool:
                public: true
                default_lifetime: 31536000  # 1 year
                adapter: cache.adapter.redis_tag_aware
                provider: '%env(REDIS_PROVIDER)%' # Redis DNS, see: https://symfony.com/doc/current/components/cache/adapters/redis_adapter.html#configure-the-connection
