pimcore_custom_reports:
    definitions:
        PTGChartNewProducts11:
            name: PTGChartNewProducts11
            sql: ''
            dataSourceConfig:
                -
                    sql: 'SELECT MONTHNAME(FROM_UNIXTIME(o1.`creationDate`)) AS `Month`, IF(Count(*),Count(*),0) AS `# of SKUs` '
                    from: 'FROM object_1 o1 '
                    where: "WHERE (o1.siopFullCode LIKE '043000%') AND (o1.`creationDate` >= MONTH(CURDATE() - Interval 9 month))  "
                    groupby: 'GROUP BY MONTHNAME(FROM_UNIXTIME(o1.`creationDate`)) order by o1.`creationDate` '
                    type: sql
            columnConfiguration:
                -
                    name: Month
                    display: true
                    export: true
                    order: true
                    width: ''
                    label: ''
                    id: extModel1989-1
                -
                    name: '# of SKUs'
                    display: true
                    export: true
                    order: true
                    width: ''
                    label: ''
                    id: extModel1989-2
            niceName: 'Chart - New Products 11'
            group: PTG
            groupIconClass: ''
            iconClass: ''
            menuShortcut: false
            reportClass: ''
            chartType: bar
            pieColumn: null
            pieLabelColumn: null
            xAxis: Month
            yAxis:
                - '# of SKUs'
            modificationDate: 1708322376
            creationDate: 1708322244
            shareGlobally: true
            sharedUserNames: {  }
            sharedRoleNames: {  }
