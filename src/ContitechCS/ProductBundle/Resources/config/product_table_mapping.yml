        Minimum Pulley Diameters:
            TableComment: "The minimum cover for vulcanized splice is 1/8 in. (3.2mm). The recommended maximum top to bottom cover ratio for one-ply is 2:1 (i.e., is 1/4 in. x 1/8 in. or 4.5 mm x 2.25 mm) and for two-ply
