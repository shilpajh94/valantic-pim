pimcore_custom_reports:
    definitions:
        CS_NewProductsLastOneWeek:
            name: CS_NewProductsLastOneWeek
            sql: ''
            dataSourceConfig:
                -
                    sql: "SELECT\n  o1.`oo_id` as `Id`,\n  o1.`Name`,\n  CASE WHEN o1.`path` = '/Contitech_ConveyorSolution/Products/' THEN 'LEVEL1' ELSE REPLACE(\n    o1.`path`,\n    '/Contitech_ConveyorSolution/Products/',\n    ''\n  ) END as `Hierarchy Level`,\n  FROM_UNIXTIME(o1.`creationDate`) as `Creation Date`,\n  CASE \nWHEN wf.`place` = 'open' THEN 'Open' \nWHEN wf.`place` = 'archived' THEN 'Archived' \nWHEN wf.`place` = 'enrich' THEN 'Enrich' \nWHEN wf.`place` = 'paused' THEN 'Paused' \nWHEN wf.`place` = 'published' THEN 'Published' \nWHEN wf.`place` = 'review_content' THEN 'Review Content' \nWHEN wf.`place` = 'accepted' THEN 'Accepted' \nWHEN wf.`place` = 'default' THEN 'Default' \nWHEN wf.`place` = 'in_process' THEN 'In Process' \nWHEN wf.`place` = 'in_rd_edit' THEN 'In R&D Edit' \nWHEN wf.`place` = 'in_publish' THEN 'In Publish' \nWHEN wf.`place` = 'in_marcom_edit' THEN 'In Marcom Edit' \nEND as `Status`"
                    from: "FROM\n  object_localized_CSProducts_en o1\n  LEFT JOIN element_workflow_state wf on o1.`oo_id` = wf.`cid`\nWHERE\n  (\n    (\n      o1.`creationDate` > UNIX_TIMESTAMP(DATE_SUB(CURDATE(), INTERVAL 7 DAY))\n    )\n  )\nORDER BY\n  (o1.`creationDate`) DESC"
                    where: ''
                    groupby: ''
                    type: sql
            columnConfiguration:
                -
                    name: Id
                    display: true
                    export: true
                    order: true
                    width: ''
                    label: ''
                    id: extModel4345-1
                -
                    name: Name
                    display: true
                    export: true
                    order: true
                    width: ''
                    label: ''
                    id: extModel4345-2
                -
                    name: 'Hierarchy Level'
                    display: true
                    export: true
                    order: true
                    width: ''
                    label: ''
                    id: extModel4345-3
                -
                    name: 'Creation Date'
                    display: true
                    export: true
                    order: true
                    width: ''
                    label: ''
                    id: extModel4345-4
                -
                    name: Status
                    display: true
                    export: true
                    order: true
                    width: ''
                    label: ''
                    id: extModel4345-5
            niceName: 'CS_New Products Last One Week'
            group: 'ContiTech CS'
            groupIconClass: ''
            iconClass: ''
            menuShortcut: false
            reportClass: ''
            chartType: ''
            pieColumn: null
            pieLabelColumn: null
            xAxis: null
            yAxis: {  }
            modificationDate: 1708342829
            creationDate: 1708244251
            shareGlobally: false
            sharedUserNames: {  }
