pimcore_custom_reports:
    definitions:
        HydraulicHoseChartProductsWithNoImage-VirtualCatalogFilter:
            name: HydraulicHoseChartProductsWithNoImage-VirtualCatalogFilter
            sql: ''
            dataSourceConfig:
                -
                    sql: "SELECT\n temp.`SIOP3`,\n SUM(temp.`skus`)  AS `# of SKUs`,\n temp.`Virtualflag`,\n ROUND(\n (SUM(temp.`images` = \"YES\") * 100.0) / Sum(temp.`skus`),\n 2\n )  AS `Yes Percentage`,\n ROUND(\n (SUM(temp.`images` = \"NO\") * 100.0) / Sum(temp.`skus`),\n 2\n ) AS ` No Percentage`"
                    from: "FROM\n (\n SELECT\n cat3.`description` AS `SIOP3`,\n count(o1.`id`) AS `skus`,\n IF(o1.`mainImage` IS Not NULL, \"YES\", \"NO\") AS `images`,\n IF(o1.`virtualCatalogFlag` = 1 , 'True', 'False' ) AS `Virtualflag`\n FROM\n object_1 o1\n LEFT JOIN object_localized_query_2_en cat3 ON cat3.ooo_id = SUBSTRING(o1.SIOPLevel3, 2,(LENGTH(o1.SIOPLevel3) - 2))\n WHERE\n (\n o1.`published` = 1\n AND (o1.siopFullCode LIKE '0415001540%' OR o1.siopFullCode LIKE '0415001550%' OR o1.siopFullCode LIKE '0415001560%' OR o1.siopFullCode LIKE '0415001530000%' OR o1.siopFullCode LIKE '0415001510000%')\n )\n GROUP BY\n cat3.`description`,\n o1.`id`,\n o1.`mainImage`\n \n ) AS temp\n"
                    where: ''
                    groupby: "GROUP BY\n temp.`SIOP3`,\n temp.`skus`,\n temp.`Virtualflag`\n ORDER BY temp.`SIOP3`"
                    type: sql
            columnConfiguration:
                -
                    name: SIOP3
                    display: true
                    export: true
                    order: true
                    width: ''
                    label: ''
                    id: extModel1827-3
                -
                    name: '# of SKUs'
                    display: true
                    export: true
                    order: true
                    width: ''
                    label: ''
                    id: extModel1827-4
                -
                    name: Virtualflag
                    display: true
                    export: true
                    order: true
                    width: ''
                    label: ''
                    id: extModel1827-5
                -
                    name: 'Yes Percentage'
                    display: true
                    export: true
                    order: true
                    width: ''
                    label: ''
                    id: extModel1827-6
                -
                    name: 'No Percentage'
                    display: true
                    export: true
                    order: true
                    width: ''
                    label: ''
                    id: extModel1827-7
            niceName: 'Chart - Products With No Image - Virtual Catalog Filter'
            group: 'Hydraulic Hose'
            groupIconClass: ''
            iconClass: ''
            menuShortcut: false
            reportClass: ''
            chartType: bar
            pieColumn: null
            pieLabelColumn: null
            xAxis: SIOP3
            yAxis:
                - 'Yes Percentage'
            modificationDate: 1708346901
            creationDate: 1708255513
            shareGlobally: true
            sharedUserNames: {  }
            sharedRoleNames: {  }
