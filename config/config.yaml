imports:
    - { resource: parameters.yaml }
    - { resource: security.yaml }
    - { resource: services.yaml }
    - { resource: "local/" }
    - { resource: product_workflow.yaml }
    - { resource: cs_product_enrichment_workflow.yaml }
    - { resource: cs_asset_workflow.yaml }
    - { resource: ptg_eu_product_enrichment_workflow.yaml }
    - { resource: ifs_eu_product_enrichment_workflow.yaml }

pimcore:
    assets:
        document:
            scan_pdf: false #disable scanning PDF documents for unsafe JavaScript.
    documents:
        auto_save_interval: 0 # saving interval in seconds, default 60s, set to 0 to disable it

    objects:
        auto_save_interval: 0 # saving interval in seconds, default 60s, set to 0 to disable it

    email:
        sender:
            name: '%env(EMAIL_SENDER_NAME)%'
            email: '%env(EMAIL_SENDER_ID)%'
        return:
            name: ''
            email: ''
