# sheet: Sheet Information
#     columnName: left hand signifies the name used as an indentifier in product service for required columns present in the sheet,  
#                 right hand side name siginifies column  name present in the import sheet
#     lastColName: 'AC' // Last column of the sheet which will be used to log row status of the sheet
#     startRow: 2 // Row number to start the reading sheet
#     importIdConfig: ['materialCode'] // This field will be used to create primary key structure of temp table.


parameters:
  # Csv header information
  sheet:
    columnName: 
      material: 'Material'
      language: 'Language'
      description:  'Material Description'
      group:  'Material Group'
      code: 'Prod Hier'
      baseUOM:  'Base UOM'
      oldMaterial:  'Old Material'
      prodHier1:  'Prod Hier 1'
      prodHier1Desc:  'Prod Hier 1 Desc'
      prodHier2:  'Prod Hier 2'
      prodHier2Desc:  'Prod Hier 2 Desc'
      prodHier3:  'Prod Hier 3'
      prodHier3Desc:  'Prod Hier 3 Desc'
      prodHier4:  'Prod Hier 4'
      prodHier4Desc:  'Prod Hier 4 Desc'
      prodHier5:  'Prod Hier 5'
      prodHier5Desc:  'Prod Hier 5 Desc'
      prodHier6:  'Prod Hier 6'
      prodHier6Desc:  'Prod Hier 6 Desc'
      prodHier7:  'Prod Hier 7'
      prodHier7Desc:  'Prod Hier 7 Desc'
      industryStandard: 'Industry Standard #'
      manufacture:  'Manufacter'
      manufacturePartNumber:  'Manufacter Part Numb'
      productBrandName: 'Product Brand Name'
      Sub_Category: 'Sub-Category'
      Category:  'Category'
      WebsiteLink: 'Website'
      minimumTemperatureC: 'minTemperature (C)'
      minimumTemperatureF: 'minimumTemperatureF'
      maximumTemperatureC: 'maxTemperature (C)'
      maximumTemperatureF: 'maximumTemperatureF'
      temporaryUntilC: 'Temporary until (C)'
      temporaryUntilT: 'Temporary until (t)'
      DampableUntil1C: 'Dampable until 1 (C)'
      DampableUntil1T: 'Dampable until 1 (t)'
      DampableUntil2C: 'Dampable until 2 (C)'
      DampableUntil2T: 'Dampable until 2 (t)'
      onlyOpenSystem: 'Open system'
      FeaturesBenefitsBulletPoint: 'Features & Benefits Bullet points'
      #base Localization Attribute
      headlineWeb: 'Headline Web'
      Marking2: 'Marking 2'
      Marking1: 'Marking 1'
      NoteInformationBelowTable: 'Notes'
      productBrandNamePerLanguage: 'Product Brand Name Per Language'
      BrandShortText2: 'BrandShortText2'
      commercialDescription: 'Commercial Description'
      technicalDescription: 'Technical Description'

    #Fert Attribute 
      EANCode: 'EAN Code'
      weightg: 'Weight g/unit'
      GrossPrice: 'Gross price EUR/unit'
      Discount: 'Discount %'
      OnStock: 'On stock'
      CustomsTariffNumber: 'Customs tariff number'
      Note: 'Note'
      Spezi: 'Spezi'
      Department: 'Department'
      ConnectionType: 'Connection type'
      productLength: 'Product length'
      EhoseID: 'ID'
      ProductLengthUnit: 'Product Length unit'
      MinimumQuantityMeasurementUnit: 'Minimum quantity measurement unit'
      priceDate: 'Price date'
      productionLength: 'Production length'
      minimumQuantityUnit: 'Minimum quantity unit'
      additionalDiscount: 'Additional discount'
    #fert Localized Attribute
      Conditions: 'Conditions'
      minimumOrder: 'Minimum order value'
      shippingConditions: 'Shipping conditions'
      sapDescription: 'SAP Description'
    #Fert Relationship 
      countryOfOrigin: 'Country of origin'

      stccCode: 'STCC Code'
      grossWeight:  'Gross Weight'
      netWeight:  'Net Weight'
      weightUnit: 'Weight Unit'
      b2BexternalID: 'External ID'
    lastColName: 'AC'
    startRow: 1
    readFrom: 2
    keyColumns: ['material']
    baseSIOPMismatchEmailTemplate: "/EmailTemplate/SIOPMismatchReport"
  
  # Root information
  root:
    type: 'dataObject'
    subType:  'object'
    fullPath: '/Contitech_IFS_EMEA/Products'
  
  # Base / Brand info
  base:
    length: 13

  # Skeleton / Product Specification info
  skeleton:
    length: 16

  # Variant (SKU) info
  variant:
    length: 16
    
  # Product Type
  productType:
    13:  'base'
    16:  'skeleton'
    16fert: 'fert'

  # SIOP Code Level Info
  level:
    1:  
      codeLength: 2
      fullCodeLength: 2
      key: 'hierarchyLevel1'
    2:  
      codeLength: 2
      fullCodeLength: 4
      key: 'hierarchyLevel2'
    3:  
      codeLength: 2
      fullCodeLength: 6
      key: 'hierarchyLevel3'
    4:  
      codeLength: 2
      fullCodeLength: 8
      key: 'hierarchyLevel4'
    5:  
      codeLength: 3
      fullCodeLength: 11
      key: 'hierarchyLevel5'
    6:  
      codeLength: 2
      fullCodeLength: 13
      key: 'hierarchyLevel6'
    7:  
      codeLength: 3
      fullCodeLength: 16
      key: 'hierarchyLevel7'

  # List of table which will use while import
  table:
      tempTable: 'ifseu_material_import_temp'
      masterTable:  'ifseu_material_import_master'
      logTable: 'ifseu_material_import_log'

  # Number of level allowed to create into SAP hierarchy for SIOP
  allowedLevel:
    IFSEU: 5
  productTypeLevel:
    6:  13 # base --- 6 is SIOP level and 13 is stand for siopfullcode length for base
    7:  16 # skeleton  --- 7 is SIOP level and 16 is stand for siopfullcode length for base
