# available statuses
#    COMPLETED : when export process completed successfully
#    FAILED : when export process ended with an error
#    KILLED : when the process was killed because it was taking longer than config->in_progress_process_life minutes
#    EXPIRED : when the process expire time has passed

# available place holders
# these place holders can be used in both of subject and body
#  [SCHEDULE_NAME]
#  [CHANNEL_NAME]
#  [USER_NAME] : user's first name if present otherwise username

mail_content:
    en:
        COMPLETED:
            subject: "Export is ready for schedule '[SCHEDULE_NAME]' channel '[CHANNEL_NAME]'."
            body: "Hi [USER_NAME],\n\n
                    The export has been successfully completed for schedule '[SCHEDULE_NAME]' of channel '[CHANNEL_NAME]'.\n "
        FAILED:
            subject: "Export process failed for schedule '[SCHEDULE_NAME]' channel '[CHANNEL_NAME]'."
            body: "Export process failed for schedule '[SCHEDULE_NAME]' channel '[CHANNEL_NAME]'."
        KILLED:
            subject: "Export process has been killed for schedule '[SCHEDULE_NAME]' channel '[CHANNEL_NAME]'."
            body:  "Export process has been killed for schedule '[SCHEDULE_NAME]' channel '[CHANNEL_NAME]'."
        EXPIRED:
            subject:  "Export has expired for schedule '[SCHEDULE_NAME]' channel '[CHANNEL_NAME]'."
            body: "Export has expired for schedule '[SCHEDULE_NAME]' channel '[CHANNEL_NAME]'."

    de:
        COMPLETED:
            subject: "deExport is ready for schedule '[SCHEDULE_NAME]' channel '[CHANNEL_NAME]'."
            body: "deHi [USER_NAME],\n\n
                    The export has been successfully completed for schedule '[SCHEDULE_NAME]' of channel '[CHANNEL_NAME]'.\n "
        FAILED:
            subject: "deExport process failed for schedule '[SCHEDULE_NAME]' channel '[CHANNEL_NAME]'."
            body: "deExport process failed for schedule '[SCHEDULE_NAME]' channel '[CHANNEL_NAME]'."
        KILLED:
            subject: "deExport process has been killed for schedule '[SCHEDULE_NAME]' channel '[CHANNEL_NAME]'."
            body:  "deExport process has been killed for schedule '[SCHEDULE_NAME]' channel '[CHANNEL_NAME]'."
        EXPIRED:
            subject:  "deExport has expired for schedule '[SCHEDULE_NAME]' channel '[CHANNEL_NAME]'."
            body: "deExport has expired for schedule '[SCHEDULE_NAME]' channel '[CHANNEL_NAME]'."