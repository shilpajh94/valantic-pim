services:
    # default configuration for services in *this* file
    _defaults:
        # automatically injects dependencies in your services
        autowire: true
        # automatically registers your services as commands, event subscribers, etc.
        autoconfigure: true
        # this means you cannot fetch services directly from the container via $container->get()
        # if you need to do this, you can override this setting on individual services
        public: false

    # controllers are imported separately to make sure they're public
    # and have a tag that allows actions to type-hint services
    ContitechCS\CatalogBundle\Controller\:
        resource: '../../Controller'
        public: true
        tags: ['controller.service_arguments']
        
    ContitechCS\CatalogBundle\Document\Areabrick\WoodProductAreaBrick:
        arguments: ['@logger']
        tags:
            - { name: pimcore.area.brick, id: wood-product-areabrick } 
               
    ContitechCS\CatalogBundle\Document\Areabrick\TextileBeltApplicationsAreaBrick:
        arguments: ['@logger']
        tags:
            - { name: pimcore.area.brick, id: textile-belt-applications-areabrick }
    
    ContitechCS\CatalogBundle\Document\Areabrick\ExampleOfAggregateAreaBrick:
        arguments: ['@logger']
        tags:
            - { name: pimcore.area.brick, id: example-of-aggregate-areabrick }                
