required_attribute:
  resource: "@DataDefinitionsBundle/Controller/"
  type:     annotation
  prefix:   /
data_definitions_admin_import_definitions:
  type: coreshop.resources
  resource: |
    alias: data_definitions.import_definition
    additional_routes:
      config:
        path: get-config
        action: getConfig
        methods: [GET]
      columns:
        path: get-columns
        action: getColumns
        methods: [GET]
      testData:
        path: test-data
        action: testData
        methods: [GET]
      upload:
        path: read-uploaded-file
        action: readUploadedFile
        methods: [GET,POST]
      import:
        path: import
        action: import
        methods: [GET,POST]
      export:
        path: export
        action: export
        methods: [GET]
      duplicate:
        path: duplicate
        action: duplicate
        methods: [POST]
      listClass:
        path: listClass
        action: listClass
        methods: [GET,POST]
      listPrimaryKey:
        path: listPrimaryKey
        action: listPrimaryKey
        methods: [GET,POST]
      saveDataDefinitionImport:
        path: saveImport
        action: saveDataDefinitionImport
        methods: [GET,POST]
      listDataDefinitionImport:
        path: importList
        action: listDataDefinitionImport
        methods: [GET,POST]
      listClassInterpreter:
        path: listClassInterpreter
        action: listClassInterpreter
        methods: [GET,POST]
      listClassField:
        path: listClassField
        action: listClassField
        methods: [GET,POST]

data_definitions_admin_export_definitions:
  type: coreshop.resources
  resource: |
    alias: data_definitions.export_definition
    additional_routes:
      config:
        path: get-config
        action: getConfig
        methods: [GET]
      columns:
        path: get-columns
        action: getColumns
        methods: [GET]
      testData:
        path: test-data
        action: testData
        methods: [GET]
      import:
        path: import
        action: import
        methods: [GET,POST]
      export:
        path: export
        action: export
        methods: [GET]
      duplicate:
        path: duplicate
        action: duplicate
        methods: [POST]

data_definitions_admin_export_import_rules:
  path: /admin/data_definitions/import_rules/export
  defaults: { _controller: Instride\Bundle\DataDefinitionsBundle\Controller\ImportRuleController::exportAction }

data_definitions_admin_import_import_rules:
  path: /admin/data_definitions/import_rules/import
  defaults: { _controller: Instride\Bundle\DataDefinitionsBundle\Controller\ImportRuleController::importAction }
