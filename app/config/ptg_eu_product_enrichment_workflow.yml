pimcore:
    workflows:
        ptg_eu_product_enrichment:
            label: "Product Workflow"
            type: "state_machine"
            initial_markings:     ["open"]
            supports:
              - 'Pimcore\Model\DataObject\PTGEUProduct'
            places:
                open:
                    label: Open
                    color: #377ea9
                    permissions:
                        -
    #                          objectLayout: 2
                            save: true
                            publish: false
                            delete: false
                            unpublish: false
                            condition: '!(has_role("ROLE_PIMCORE_ADMIN"))'
                in_marcom_edit:
                    label: In Marcom Edit
                    color: #377ea9
                    permissions:
                        -
    #                          objectLayout: 1
                            save: true
                            publish: false
                            delete: false
                            unpublish: false
                            condition: '!(has_role("ROLE_PIMCORE_ADMIN"))'
                in_editor_edit:
                    label: In Editor Edit
                    color: #377ea9
                    permissions:
                        -
    #                          objectLayout: 1
                            save: true
                            publish: false
                            delete: false
                            unpublish: false
                            condition: '!(has_role("ROLE_PIMCORE_ADMIN"))'
                in_review:
                    label: In Product Manger Review
                    color: #377ea9
                    permissions:
                        -
    #                          objectLayout: 1
                            save: true
                            publish: false
                            delete: false
                            unpublish: false
                            condition: '!(has_role("ROLE_PIMCORE_ADMIN"))'
                published:
                    label: Published
                    color: #377ea9
                    permissions:
                        -
    #                          objectLayout: 1
                            save: true
                            publish: false
                            delete: false
                            unpublish: false
                            condition: '!(has_role("ROLE_PIMCORE_ADMIN"))'
                in_editor_edit_after_publish:
                    label: In Editor Edit
                    color: #377ea9
                    permissions:
                        -
    #                          objectLayout: 1
                            save: true
                            publish: false
                            delete: false
                            unpublish: false
                            condition: '!(has_role("ROLE_PIMCORE_ADMIN"))'
                in_marcom_edit_after_publish:
                    label: In Marcom Edit
                    color: #377ea9
                    permissions:
                        -
    #                          objectLayout: 1
                            save: true
                            publish: false
                            delete: false
                            unpublish: false
                            condition: '!(has_role("ROLE_PIMCORE_ADMIN"))'
            transitions:
                send_to_editor:
                    from:
                        - open
                    to: in_marcom_edit
                    guard: (has_role("ROLE_PIMCORE_ADMIN") or has_role("ROLE_APPLICATIONADMIPTGEU") or has_role("ROLE_EDITORPTGEU"))
                    options:
                        label: 'Send to Marcom'
                        notes:
                            commentEnabled: true
                            commentRequired: true
                        changePublishedState: save_version
                send_to_marcom:
                    from:
                        - in_editor_edit
                    to: in_marcom_edit
                    guard: (has_role("ROLE_PIMCORE_ADMIN") or has_role("ROLE_APPLICATIONADMIPTGEU") or has_role("ROLE_EDITORPTGEU"))
                    options:
                        label: 'Send to MarCom'
                        notes:
                            commentEnabled: true
                            commentRequired: true
                        changePublishedState: save_version
                send_to_editor_for_fixes:
                    from:
                        - in_marcom_edit
                    to: in_editor_edit
                    guard: (has_role("ROLE_PIMCORE_ADMIN") or has_role("ROLE_APPLICATIONADMINPTGEU") or has_role("ROLE_MARCOMPTGEU"))
                    options:
                        label: 'Send to Editor for fixes'
                        notes:
                            commentEnabled: true
                            commentRequired: true
                        changePublishedState: save_version
                send_to_marcom_for_fixes:
                    from:
                        - in_review
                    to: in_marcom_edit
                    guard: (has_role("ROLE_PIMCORE_ADMIN") or has_role("ROLE_APPLICATIONADMIPTGEU") or has_role("ROLE_PRODUCTMANAGERPTGEU"))
                    options:
                        label: 'Send to MarCom for Fixes'
                        notes:
                            commentEnabled: true
                            commentRequired: true
                        changePublishedState: save_version
                send_to_pm_for_review:
                    from:
                        - in_marcom_edit
                    to: in_review
                    guard: (has_role("ROLE_PIMCORE_ADMIN") or has_role("ROLE_APPLICATIONADMINPTGEU") or has_role("ROLE_MARCOMPTGEU"))
                    options:
                        label: 'Send to PM for Review'
                        notes:
                            commentEnabled: true
                            commentRequired: true
                        changePublishedState: save_version
                approved:
                    from:
                        - in_review
                        # - published
                    to: published
                    guard: (has_role("ROLE_PIMCORE_ADMIN") or has_role("ROLE_APPLICATIONADMINPTGEU") or has_role("ROLE_PRODUCTMANAGERPTGEU"))
                    options:
                        label: 'Published'
                        notes:
                            commentEnabled: true
                            commentRequired: false
                        changePublishedState: force_published
                in_editor_edit_after_publish:
                    from:
                        - published
                    to: in_editor_edit_after_publish
                    guard: (has_role("ROLE_PIMCORE_ADMIN") or has_role("ROLE_APPLICATIONADMINPTGEU") or has_role("ROLE_MARCOMPTGEU"))
                    options:
                        label: 'Send to Editor for fixes'
                        notes:
                            commentEnabled: true
                            commentRequired: false
                        changePublishedState: force_published
                in_marcom_edit_after_publish:
                    from:
                        - published
                    to: in_marcom_edit_after_publish
                    guard: (has_role("ROLE_PIMCORE_ADMIN") or has_role("ROLE_APPLICATIONADMINPTGEU") or has_role("ROLE_EDITORPTGEU"))
                    options:
                        label: 'Send to Marcom for fixes'
                        notes:
                            commentEnabled: true
                            commentRequired: false
                        changePublishedState: force_published
              