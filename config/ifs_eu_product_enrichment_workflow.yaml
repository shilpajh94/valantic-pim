pimcore:
    workflows:
        ifs_eu_product_enrichment:
            label: "Product Workflow"
            type: "state_machine"
            initial_markings:     ["open"]
            supports:
              - 'Pimcore\Model\DataObject\IFSEUProduct'
            places:
                open:
                    label: Open
                    color: #377ea9
                    permissions:
                        - condition: '!(("ROLE_PIMCORE_ADMIN") in role_names or ("ROLE_APPLICATIONADMINIFSEMEA") in role_names or ("ROLE_EDITORIFSEMEA") in role_names or ("ROLE_PRODUCTMANAGEMENTIFSEMEA") in role_names or ("ROLE_MARCOMIFSEMEA") in role_names)'
                          save: false
                          publish: false
                          delete: false
                          unpublish: false
                        - condition: '(("ROLE_APPLICATIONADMINIFSEMEA") in role_names or ("ROLE_EDITORIFSEMEA") in role_names or ("ROLE_PRODUCTMANAGEMENTIFSEMEA") in role_names or ("ROLE_MARCOMIFSEMEA") in role_names)'
                          save: true
                          publish: false
                          delete: false
                          unpublish: false                         
                in_marcom_edit:
                    label: In Marcom Edit
                    color: #377ea9
                    permissions:
                        - condition: '!(("ROLE_PIMCORE_ADMIN") in role_names or ("ROLE_APPLICATIONADMINIFSEMEA") in role_names or ("ROLE_EDITORIFSEMEA") in role_names or ("ROLE_PRODUCTMANAGEMENTIFSEMEA") in role_names or ("ROLE_MARCOMIFSEMEA") in role_names)'
                          save: false
                          publish: false
                          delete: false
                          unpublish: false
                        - condition: '(("ROLE_APPLICATIONADMINIFSEMEA") in role_names or ("ROLE_EDITORIFSEMEA") in role_names or ("ROLE_PRODUCTMANAGEMENTIFSEMEA") in role_names or ("ROLE_MARCOMIFSEMEA") in role_names)'
                          save: true
                          publish: false
                          delete: false
                          unpublish: false                         
                in_editor_edit:
                    label: In Editor Edit
                    color: #377ea9
                    permissions:
                        - condition: '!(("ROLE_PIMCORE_ADMIN") in role_names or ("ROLE_APPLICATIONADMINIFSEMEA") in role_names or ("ROLE_EDITORIFSEMEA") in role_names or ("ROLE_PRODUCTMANAGEMENTIFSEMEA") in role_names or ("ROLE_MARCOMIFSEMEA") in role_names)'
                          save: false
                          publish: false
                          delete: false
                          unpublish: false
                        - condition: '(("ROLE_APPLICATIONADMINIFSEMEA") in role_names or ("ROLE_EDITORIFSEMEA") in role_names or ("ROLE_PRODUCTMANAGEMENTIFSEMEA") in role_names or ("ROLE_MARCOMIFSEMEA") in role_names)'
                          save: true
                          publish: false
                          delete: false
                          unpublish: false                         
                in_review:
                    label: In Product Manger Review
                    color: #377ea9
                    permissions:
                        - condition: '!(("ROLE_PIMCORE_ADMIN") in role_names or ("ROLE_APPLICATIONADMINIFSEMEA") in role_names or ("ROLE_EDITORIFSEMEA") in role_names or ("ROLE_PRODUCTMANAGEMENTIFSEMEA") in role_names or ("ROLE_MARCOMIFSEMEA") in role_names)'
                          save: false
                          publish: false
                          delete: false
                          unpublish: false
                        - condition: '(("ROLE_APPLICATIONADMINIFSEMEA") in role_names or ("ROLE_EDITORIFSEMEA") in role_names or ("ROLE_PRODUCTMANAGEMENTIFSEMEA") in role_names or ("ROLE_MARCOMIFSEMEA") in role_names)'
                          save: true
                          publish: false
                          delete: false
                          unpublish: false                         
                published:
                    label: Published
                    color: #377ea9
                    permissions:
                        - condition: '!(("ROLE_PIMCORE_ADMIN") in role_names or ("ROLE_APPLICATIONADMINIFSEMEA") in role_names or ("ROLE_EDITORIFSEMEA") in role_names or ("ROLE_PRODUCTMANAGEMENTIFSEMEA") in role_names or ("ROLE_MARCOMIFSEMEA") in role_names)'
                          save: false
                          publish: false
                          delete: false
                          unpublish: false
                        - condition: '(("ROLE_APPLICATIONADMINIFSEMEA") in role_names or ("ROLE_EDITORIFSEMEA") in role_names or ("ROLE_PRODUCTMANAGEMENTIFSEMEA") in role_names or ("ROLE_MARCOMIFSEMEA") in role_names)'
                          save: true
                          publish: false
                          delete: false
                          unpublish: false                         
                in_editor_edit_after_publish:
                    label: In Editor Edit
                    color: #377ea9
                    permissions:
                        - condition: '!(("ROLE_PIMCORE_ADMIN") in role_names or ("ROLE_APPLICATIONADMINIFSEMEA") in role_names or ("ROLE_EDITORIFSEMEA") in role_names or ("ROLE_PRODUCTMANAGEMENTIFSEMEA") in role_names or ("ROLE_MARCOMIFSEMEA") in role_names)'
                          save: false
                          publish: false
                          delete: false
                          unpublish: false
                        - condition: '(("ROLE_APPLICATIONADMINIFSEMEA") in role_names or ("ROLE_EDITORIFSEMEA") in role_names or ("ROLE_PRODUCTMANAGEMENTIFSEMEA") in role_names or ("ROLE_MARCOMIFSEMEA") in role_names)'
                          save: true
                          publish: false
                          delete: false
                          unpublish: false                         
                in_marcom_edit_after_publish:
                    label: In Marcom Edit
                    color: #377ea9
                    permissions:
                        - condition: '!(("ROLE_PIMCORE_ADMIN") in role_names or ("ROLE_APPLICATIONADMINIFSEMEA") in role_names or ("ROLE_EDITORIFSEMEA") in role_names or ("ROLE_PRODUCTMANAGEMENTIFSEMEA") in role_names or ("ROLE_MARCOMIFSEMEA") in role_names)'
                          save: false
                          publish: false
                          delete: false
                          unpublish: false
                        - condition: '(("ROLE_APPLICATIONADMINIFSEMEA") in role_names or ("ROLE_EDITORIFSEMEA") in role_names or ("ROLE_PRODUCTMANAGEMENTIFSEMEA") in role_names or ("ROLE_MARCOMIFSEMEA") in role_names)'
                          save: true
                          publish: false
                          delete: false
                          unpublish: false                         
                in_pm_review_after_publish:
                    label: In Product Manger Review
                    color: #377ea9
                    permissions:
                        - condition: '!(("ROLE_PIMCORE_ADMIN") in role_names or ("ROLE_APPLICATIONADMINIFSEMEA") in role_names or ("ROLE_EDITORIFSEMEA") in role_names or ("ROLE_PRODUCTMANAGEMENTIFSEMEA") in role_names or ("ROLE_MARCOMIFSEMEA") in role_names)'
                          save: false
                          publish: false
                          delete: false
                          unpublish: false
                        - condition: '(("ROLE_APPLICATIONADMINIFSEMEA") in role_names or ("ROLE_EDITORIFSEMEA") in role_names or ("ROLE_PRODUCTMANAGEMENTIFSEMEA") in role_names or ("ROLE_MARCOMIFSEMEA") in role_names)'
                          save: true
                          publish: false
                          delete: false
                          unpublish: false                         
            transitions:
                send_to_marcom:
                    from:
                        - open
                    to: in_marcom_edit
                    guard: (("ROLE_PIMCORE_ADMIN")  in role_names or ("ROLE_APPLICATIONADMINIFSEMEA") in role_names or ("ROLE_EDITORIFSEMEA") in role_names)
                    options:
                        label: 'Send to Marcom'
                        notes:
                            commentEnabled: true
                            commentRequired: true
                        changePublishedState: save_version
                send_to_marcom_again:
                    from:
                        - in_editor_edit
                    to: in_marcom_edit
                    guard: (("ROLE_PIMCORE_ADMIN") in role_names or ("ROLE_APPLICATIONADMINIFSEMEA") in role_names or ("ROLE_EDITORIFSEMEA") in role_names)
                    options:
                        label: 'Send to MarCom'
                        notes:
                            commentEnabled: true
                            commentRequired: true
                        changePublishedState: save_version
                send_to_editor_for_fixes:
                    from:
                        - in_marcom_edit
                    to: in_editor_edit
                    guard: (("ROLE_PIMCORE_ADMIN") in role_names or ("ROLE_APPLICATIONADMINIFSEMEA") in role_names or ("ROLE_MARCOMIFSEMEA") in role_names)
                    options:
                        label: 'Send to Editor for Fixes'
                        notes:
                            commentEnabled: true
                            commentRequired: true
                        changePublishedState: save_version
                send_to_marcom_for_fixes:
                    from:
                        - in_review
                    to: in_marcom_edit
                    guard: (("ROLE_PIMCORE_ADMIN") in role_names or ("ROLE_APPLICATIONADMINIFSEMEA") in role_names or ("ROLE_PRODUCTMANAGEMENTIFSEMEA") in role_names)
                    options:
                        label: 'Send to MarCom for Fixes'
                        notes:
                            commentEnabled: true
                            commentRequired: true
                        changePublishedState: save_version
                send_to_pm_for_review:
                    from:
                        - in_marcom_edit
                    to: in_review
                    guard: (("ROLE_PIMCORE_ADMIN") in role_names or ("ROLE_APPLICATIONADMINIFSEMEA") in role_names or ("ROLE_MARCOMIFSEMEA") in role_names)
                    options:
                        label: 'Send to PM for Review'
                        notes:
                            commentEnabled: true
                            commentRequired: true
                        changePublishedState: save_version
                approved:
                    from:
                        - in_review
                        - published
                    to: published
                    guard: (("ROLE_PIMCORE_ADMIN") in role_names or ("ROLE_APPLICATIONADMINIFSEMEA") in role_names or ("ROLE_PRODUCTMANAGEMENTIFSEMEA") in role_names)
                    options:
                        label: 'Published'
                        notes:
                            commentEnabled: true
                            commentRequired: false
                        changePublishedState: force_published
                in_editor_edit_after_publish:
                    from:
                        - published
                    to: in_editor_edit_after_publish
                    guard: (("ROLE_PIMCORE_ADMIN") in role_names or ("ROLE_APPLICATIONADMINIFSEMEA") in role_names or ("ROLE_MARCOMIFSEMEA") in role_names)
                    options:
                        label: 'Send to Editor For Fixes'
                        notes:
                            commentEnabled: true
                            commentRequired: false
                        changePublishedState: save_version
                in_marcom_edit_after_publish:
                    from:
                        - published
                    to: in_marcom_edit_after_publish
                    guard: (("ROLE_PIMCORE_ADMIN") in role_names or ("ROLE_APPLICATIONADMINIFSEMEA") in role_names or ("ROLE_EDITORIFSEMEA") in role_names)
                    options:
                        label: 'Send to Marcom for Review'
                        notes:
                            commentEnabled: true
                            commentRequired: false
                        changePublishedState: save_version
                in_pm_review_after_editor_edit:
                    from:
                        - published
                    to: in_pm_review_after_publish
                    guard: (("ROLE_PIMCORE_ADMIN") in role_names or ("ROLE_APPLICATIONADMINIFSEMEA") in role_names or ("ROLE_EDITORIFSEMEA") in role_names or ("ROLE_MARCOMIFSEMEA") in role_names)
                    options:
                        label: 'Send to PM for Review'
                        notes:
                            commentEnabled: true
                            commentRequired: false
                        changePublishedState: save_version
                in_editor_edit_after_marcom_review:
                    from:
                        - in_marcom_edit_after_publish
                    to: in_editor_edit_after_publish
                    guard: (("ROLE_PIMCORE_ADMIN") in role_names or ("ROLE_APPLICATIONADMINIFSEMEA") in role_names or ("ROLE_MARCOMIFSEMEA") in role_names)
                    options:
                        label: 'Send to Editor for Fixes'
                        notes:
                            commentEnabled: true
                            commentRequired: false
                        changePublishedState: save_version
                in_pm_review_after_marcom:
                    from:
                        - in_marcom_edit_after_publish
                    to: in_pm_review_after_publish
                    guard: (("ROLE_PIMCORE_ADMIN") in role_names or ("ROLE_APPLICATIONADMINIFSEMEA") in role_names or ("ROLE_MARCOMIFSEMEA") in role_names)
                    options:
                        label: 'Send to PM for Review'
                        notes:
                            commentEnabled: true
                            commentRequired: false
                        changePublishedState: save_version
                in_marcom_edit_after_editor_fixes:
                    from:
                        - in_editor_edit_after_publish
                    to: in_marcom_edit_after_publish
                    guard: (("ROLE_PIMCORE_ADMIN") in role_names or ("ROLE_APPLICATIONADMINIFSEMEA") in role_names or ("ROLE_EDITORIFSEMEA") in role_names)
                    options:
                        label: 'Send to Marcom'
                        notes:
                            commentEnabled: true
                            commentRequired: false
                        changePublishedState: save_version
                in_pm_review_after_editor:
                    from:
                        - in_editor_edit_after_publish
                    to: in_pm_review_after_publish
                    guard: (("ROLE_PIMCORE_ADMIN") in role_names or ("ROLE_APPLICATIONADMINIFSEMEA") in role_names or ("ROLE_EDITORIFSEMEA") in role_names)
                    options:
                        label: 'Send to PM for Review'
                        notes:
                            commentEnabled: true
                            commentRequired: false
                        changePublishedState: save_version
                in_marcom_edit_after_pm_review:
                    from:
                        - in_pm_review_after_publish
                    to: in_marcom_edit_after_publish
                    guard: (("ROLE_PIMCORE_ADMIN") in role_names or ("ROLE_APPLICATIONADMINIFSEMEA") in role_names or ("ROLE_PRODUCTMANAGEMENTIFSEMEA") in role_names)
                    options:
                        label: 'Send to Marcom for Fixes'
                        notes:
                            commentEnabled: true
                            commentRequired: false
                        changePublishedState: save_version
                in_editor_edit_after_pm_review:
                    from:
                        - in_pm_review_after_publish
                    to: in_editor_edit_after_publish
                    guard: (("ROLE_PIMCORE_ADMIN") in role_names or ("ROLE_APPLICATIONADMINIFSEMEA") in role_names or ("ROLE_PRODUCTMANAGEMENTIFSEMEA") in role_names)
                    options:
                        label: 'Send to Editor for Fixes'
                        notes:
                            commentEnabled: true
                            commentRequired: false
                        changePublishedState: save_version
                in_pm_review:
                    from:
                        - in_pm_review_after_publish
                    to: published
                    guard: (("ROLE_PIMCORE_ADMIN") in role_names or ("ROLE_APPLICATIONADMINIFSEMEA") in role_names or ("ROLE_PRODUCTMANAGEMENTIFSEMEA") in role_names)
                    options:
                        label: 'Published'
                        notes:
                            commentEnabled: true
                            commentRequired: false
                        changePublishedState: force_published