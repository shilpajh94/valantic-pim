imports:
    - { resource: parameters.yml }
    - { resource: security.yml }
    - { resource: services.yml }
    - { resource: 'local/' }

pimcore:
    workflows:
        product_publishing:
            label: 'Product Workflow'
            type: 'state_machine'
            audit_trail:
                enabled: true
            supports:
            - 'Pimcore\Model\DataObject\Product'
            places:
                enrich:
                    label: 'Enrich product'
                    color: '#377ea9'
#                    permissions:
#                        - objectLayout: 5
                review_content:
                    label: 'Review Enriched Data'
                    title: 'Review Product'
                    color: '#d9ef36'
#                    permissions:
#                        - objectLayout: 6
                accepted:
                    label: 'Product Published'
                    color: '#28a013'
                rejected:
                    label: 'Product Unpublished'
                    color: '#f70a0a'
            transitions:
                enrich_again:
                    from: [review_content]
                    to: enrich
                    guard: "is_fully_authenticated() and has_role('ROLE_PRODUCTMANAGER')"
                    # notificationSettings:
                    #     notifyRoles: ['ROLE_EDITOR']
                    #     mailPath: '@PimcoreCore/Workflow/NotificationEmail/notificationEmail.html.twig'
                    options:
                        label: 'Send back to enrich again'
                        notes:
                            commentEnabled: true
                            commentRequired: true
                            additionalFields:
                                -
                                    name: 'priority'
                                    title: 'Set Priority'
                                    fieldType: 'select'
                                    fieldTypeSettings:
                                        options:
                                            -
                                                key: 'Normal'
                                                value: 'normal'
                                            -
                                                key: 'High'
                                                value: 'high'
                        changePublishedState: "no_change"
                start_processing:
                    from: [enrich]
                    to: review_content
                    guard: "is_fully_authenticated() and has_role('ROLE_EDITOR')"
                    # iconClass: '/bundles/pimcoreadmin/img/flat-color-icons/email.svg'
                    # notificationSettings:
                    #     notifyRoles: ['ROLE_PRODUCTMANAGER']
                    #     mailPath: '@PimcoreCore/Workflow/NotificationEmail/notificationEmail.html.twig'
                    options:
                        label: 'Product Enriched'
                        notes:
                            commentEnabled: true
                            commentRequired: true
                            additionalFields:
                                -
                                    name: 'priority'
                                    title: 'Set Priority'
                                    fieldType: 'select'
                                    fieldTypeSettings:
                                        options:
                                            -
                                                key: 'Normal'
                                                value: 'normal'
                                            -
                                                key: 'High'
                                                value: 'high'
                        changePublishedState: "no_change"
                publish:
                    from: review_content
                    to: [accepted]
                    guard: "is_fully_authenticated() and has_role('ROLE_PRODUCTMANAGER')"
                    # notificationSettings:
                    #     notifyRoles: ['ROLE_PRODUCTMANAGER']
                    #     mailPath: '@PimcoreCore/Workflow/NotificationEmail/notificationEmail.html.twig'
                    options:
                        label: 'Publish the product'
                        notes:
                            commentEnabled:       true
                            commentRequired:      true
                            changePublishedState: "force_published"
                unpublish:
                    from: [enrich, review_content, accepted]
                    to: rejected
                    guard: "is_fully_authenticated() and has_role('ROLE_PRODUCTMANAGER')"
                    # changePublishedState: "force_unpublished"
                    # notificationSettings:
                    #     notifyRoles: ['ROLE_PRODUCTMANAGER']
                    #     mailPath: '@PimcoreCore/Workflow/NotificationEmail/notificationEmail.html.twig'
                    options:
                        label: 'Unpublish the product'
                        notes:
                            commentEnabled:       true
                            commentRequired:      true
                        changePublishedState: "force_unpublished"
                reopen:
                    from: [accepted, rejected]
                    to: enrich
                    guard: "is_fully_authenticated() and has_role('ROLE_PRODUCT-MANAGER')"
                    options:
                        label: 'Product open to enrich'
                        notes:
                            commentEnabled:       true
                            commentRequired:      true
                            additionalFields:
                                -
                                    name: 'priority'
                                    title: 'Set Priority'
                                    fieldType: 'select'
                                    fieldTypeSettings:
                                        options:
                                            -
                                                key: 'Normal'
                                                value: 'normal'
                                            -
                                                key: 'High'
                                                value: 'high'

