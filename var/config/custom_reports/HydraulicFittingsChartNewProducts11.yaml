pimcore_custom_reports:
    definitions:
        HydraulicFittingsChartNewProducts11:
            name: HydraulicFittingsChartNewProducts11
            sql: ''
            dataSourceConfig:
                -
                    sql: 'SELECT MONTHNAME(FROM_UNIXTIME(o1.`creationDate`)) AS `Month`, IF(Count(*),Count(*),0) AS `# of SKUs`  '
                    from: 'FROM object_1 o1 '
                    where: "WHERE  (o1.siopFullCode LIKE '0415001570%' OR o1.siopFullCode LIKE  '0415001580%' OR o1.siopFullCode LIKE '0415001530100%' OR o1.siopFullCode LIKE '0415001510100%') AND (o1.`creationDate` >= MONTH(CURDATE() - Interval 9 month))  "
                    groupby: 'GROUP BY MONTHNAME(FROM_UNIXTIME(o1.`creationDate`)) order by o1.`creationDate` '
                    type: sql
            columnConfiguration:
                -
                    name: Month
                    display: true
                    export: true
                    order: true
                    width: ''
                    label: ''
                    id: extModel2233-3
                -
                    name: '# of SKUs'
                    display: true
                    export: true
                    order: true
                    width: ''
                    label: ''
                    id: extModel2233-4
            niceName: 'Chart - New Products 11'
            group: 'Hydraulic Fittings'
            groupIconClass: ''
            iconClass: ''
            menuShortcut: false
            reportClass: ''
            chartType: bar
            pieColumn: null
            pieLabelColumn: null
            xAxis: Month
            yAxis:
                - '# of SKUs'
            modificationDate: 1708261041
            creationDate: 1708246917
            shareGlobally: true
            sharedUserNames: {  }
            sharedRoleNames: {  }
