services:
    assets_s3:
        class: 'Aws\S3\S3Client'
        arguments:
            -  endpoint: 'https://s3.eu-central-1.amazonaws.com'
               region: 'eu-central-1'
               version: 'latest'
flysystem:
    storages:
        pimcore.asset.storage:
            adapter: 'aws'
            visibility: private
            options:
                client: 'assets_s3'
                bucket: 'pimcorex-contitech-assets-prod'
                prefix: assets
        pimcore.version.storage:
           # Storage for serialized versioning data of documents/asset/data objects
            adapter: 'aws'
            visibility: public
            options:
                client: 'version_s3'
                bucket: 'pim-prod-versions'
                prefix: 'versions'
