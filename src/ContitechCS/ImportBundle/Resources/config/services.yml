services:
    # default configuration for services in *this* file
    _defaults:
        # automatically injects dependencies in your services
        autowire: true
        # automatically registers your services as commands, event subscribers, etc.
        autoconfigure: true
        # this means you cannot fetch services directly from the container via $container->get()
        # if you need to do this, you can override this setting on individual services
        public: false

    # controllers are imported separately to make sure they're public
    # and have a tag that allows actions to type-hint services
    ContitechCS\ImportBundle\Controller\:
        resource: "../../Controller"
        public: true
        tags: ["controller.service_arguments"]

    # add more services, or override services that need manual wiring
    #    ContitechCS\ImportBundle\ExampleClass:
    #        arguments:
    #            - "@service_id"
    #            - "plain_value"
    #            - "%parameter%"

    cs_import.lookup_service:
        class: ContitechCS\ImportBundle\Services\Lookup
        public: true

    # auto-register all commands as services
    ContitechCS\ImportBundle\Command\:
        resource: "../../Command/*"
        tags: ["console.command"]

    ContitechCS\ImportBundle\CSImportCommand:
        tags:
            - { name: "console.command", command: "cs:import" }
    ContitechCS\ImportBundle\OneTimeImportCommand\CSHierarchyImportCommand:
        tags:
            - {
                  name: "console.command",
                  command: "cs:one-time-import:product-hierarchy-import",
              }
    ContitechCS\ImportBundle\OneTimeImportCommand\CSProductDataImportCommand:
        tags:
            - {
                  name: "console.command",
                  command: "cs:one-time-import:product-data-import",
              }
    ContitechCS\ImportBundle\OneTimeImportCommand\CSKenticoAssetImportCommand:
        tags:
            - {
                  name: "console.command",
                  command: "cs:one-time-import:kentico-asset-import",
              }
    ContitechCS\ImportBundle\OneTimeImportCommand\CSFeatureAndBenefitImportCommand:
        tags:
            - {
                  name: "console.command",
                  command: "cs:one-time-import:feature-and-benefit-import",
              }
    ContitechCS\ImportBundle\OneTimeImportCommand\CSRelatedProductMappingCommand:
        tags:
            - {
                  name: "console.command",
                  command: "cs:one-time-import:related-product-mapping",
              }
