services:
    # default configuration for services in *this* file
    _defaults:
        # automatically injects dependencies in your services
        autowire: true
        # automatically registers your services as commands, event subscribers, etc.
        autoconfigure: true
        # this means you cannot fetch services directly from the container via $container->get()
        # if you need to do this, you can override this setting on individual services
        public: false

    # controllers are imported separately to make sure they're public
    # and have a tag that allows actions to type-hint services
    RequiredAttributesBundle\Controller\:
        resource: '../src/Controller'
        public: true
        tags: ['controller.service_arguments']

# add more services, or override services that need manual wiring
#    RequiredAttributesBundle\ExampleClass:
#        arguments:
#            - "@service_id"
#            - "plain_value"
#            - "%parameter%"


    RequiredAttributesBundle\Services\ConfigResolver:
        public: true

    RequiredAttributesBundle\Services\RequiredAttributeIndicatorFieldPopulator:
        public: true

    RequiredAttributesBundle\EventListeners\ProductListener:
        tags:
            - { name: kernel.event_listener, event: pimcore.dataobject.preUpdate, method: preUpdate , priority: -10}

    RequiredAttributesBundle\Services\CustomizationService:
        public: true

    Pimcore\Bundle\AdminBundle\Controller\Admin\TranslationController:
        class: RequiredAttributesBundle\Controller\CustomTranslationController

    Pimcore\Bundle\XliffBundle\Controller\XliffTranslationController:
        class: RequiredAttributesBundle\Controller\CustomXliffTranslationController

    Pimcore\Bundle\AdminBundle\Controller\Admin\Asset\AssetController:
        class: RequiredAttributesBundle\Controller\CustomAssetController