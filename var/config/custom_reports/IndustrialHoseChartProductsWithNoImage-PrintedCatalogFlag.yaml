pimcore_custom_reports:
    definitions:
        IndustrialHoseChartProductsWithNoImage-PrintedCatalogFlag:
            name: IndustrialHoseChartProductsWithNoImage-PrintedCatalogFlag
            sql: ''
            dataSourceConfig:
                -
                    sql: "SELECT\n temp.`SIOP3`,\n SUM(temp.`skus`)  AS `# of SKUs`,\n temp.`PrintedFlag`,\n ROUND(\n (SUM(temp.`images` = \"YES\") * 100.0) / Sum(temp.`skus`),\n 2\n )  AS `Yes Percentage`,\n ROUND(\n (SUM(temp.`images` = \"NO\") * 100.0) / Sum(temp.`skus`),\n 2\n ) AS ` No Percentage`"
                    from: "FROM\n (\n SELECT\n cat3.`description` AS `SIOP3`,\n count(o1.`id`) AS `skus`,\n IF(o1.`mainImage` IS Not NULL, \"YES\", \"NO\") AS `images`,\n IF(o1.`printedCatalogFlag` = 1 , 'True', 'False' ) AS `PrintedFlag`\n FROM\n object_1 o1\n LEFT JOIN object_localized_query_2_en cat3 ON cat3.ooo_id = SUBSTRING(o1.SIOPLevel3, 2,(LENGTH(o1.SIOPLevel3) - 2))\n WHERE\n (\n o1.`published` = 1\n AND o1.siopFullCode LIKE '041000%'\n )\n GROUP BY\n cat3.`description`,\n o1.`id`,\n o1.`mainImage`\n \n ) AS temp"
                    where: ''
                    groupby: "GROUP BY\n temp.`SIOP3`,\n temp.`skus`,\n temp.`printedflag`\n ORDER BY temp.`SIOP3`"
                    type: sql
            columnConfiguration:
                -
                    name: SIOP3
                    display: true
                    export: true
                    order: true
                    width: ''
                    label: ''
                    id: extModel3025-3
                -
                    name: '# of SKUs'
                    display: true
                    export: true
                    order: true
                    width: ''
                    label: ''
                    id: extModel3025-4
                -
                    name: PrintedFlag
                    display: true
                    export: true
                    order: true
                    width: ''
                    label: ''
                    id: extModel3025-5
                -
                    name: 'Yes Percentage'
                    display: true
                    export: true
                    order: true
                    width: ''
                    label: ''
                    id: extModel3025-6
                -
                    name: 'No Percentage'
                    display: true
                    export: true
                    order: true
                    width: ''
                    label: ''
                    id: extModel3025-7
            niceName: 'Chart - Products With No Image - Printed Catalog Filter'
            group: 'Industrial Hose'
            groupIconClass: ''
            iconClass: ''
            menuShortcut: false
            reportClass: ''
            chartType: bar
            pieColumn: null
            pieLabelColumn: null
            xAxis: SIOP3
            yAxis:
                - 'Yes Percentage'
            modificationDate: 1708344987
            creationDate: 1708320687
            shareGlobally: true
            sharedUserNames: {  }
            sharedRoleNames: {  }
