pimcore:
    workflows:
        product_enrichment:
            label: "Product Workflow"
            type: "state_machine"
            supports:
              - 'Pimcore\Model\DataObject\CSProducts'
            places:
                In_progress:
                    label: In Progress
                    color: #377ea9
                    permissions:
                        -
                          objectLayout: 2
                          save: true
                          publish: false
                          delete: false
                          unpublish: false
                          condition: '!(has_role("ROLE_PIMCORE_ADMIN"))'

                In_review:
                    label: In Review
                    color: #377ea9
                    permissions:
                        -
                          objectLayout: 1
                          save: true
                          publish: false
                          delete: false
                          unpublish: false
                          condition: '!(has_role("ROLE_PIMCORE_ADMIN"))'

                Published:
                    label: Published
                    color: #377ea9
                    permissions:
                        -
                          objectLayout: 1
                          save: true
                          publish: true
                          delete: false
                          unpublish: false
                          condition: '!(has_role("ROLE_PIMCORE_ADMIN"))'

                Approved:
                    label: Approved
                    color: #377ea9
                    permissions:
                        -
                          objectLayout: 1
                          save: true
                          publish: false
                          delete: false
                          unpublish: false
                          condition: '!(has_role("ROLE_PIMCORE_ADMIN"))'

                Archived:
                    label: Archived
                    color: #377ea9
                    permissions:
                        -
                          objectLayout: 2
                          save: true
                          publish: false
                          delete: false
                          unpublish: false
                          condition: '!(has_role("ROLE_PIMCORE_ADMIN"))'        

                Paused:
                    label: Paused
                    color: #377ea9
                    permissions:
                        -
                          objectLayout: 2
                          save: true
                          publish: false
                          delete: false
                          unpublish: false
                          condition: '!(has_role("ROLE_PIMCORE_ADMIN"))'
            transitions:
                send_for_review:
                    from:
                        - In_progress
                        - Published
                    to: In_review
                    guard: (has_role("ROLE_PIMCORE_ADMIN") or has_role("ROLE_PIMCORE_APPLICATIONADMINCS") or has_role("ROLE_PRODUCTMANAGERCS"))
                    options:
                        label: 'Send for review'
                        notes:
                            commentEnabled: true
                            commentRequired: true
                        changePublishedState: force_unpublished
                reject_product:
                    from:
                        - In_review
                    to: In_progress
                    guard: (has_role("ROLE_PIMCORE_ADMIN") or has_role("ROLE_PIMCORE_APPLICATIONADMINCS") or has_role("ROLE_MARCOMCS"))
                    options:
                        label: 'Reject'
                        notes:
                            commentEnabled: true
                            commentRequired: true
                        changePublishedState: force_unpublished

                approve_processing:
                    from:
                        - In_review
                    to: Approved
                    guard: (has_role("ROLE_PIMCORE_ADMIN") or has_role("ROLE_PIMCORE_APPLICATIONADMINCS") or has_role("ROLE_MARCOMCS"))
                    options:
                        label: 'Approve'
                        notes:
                            commentEnabled: true
                            commentRequired: false
                        changePublishedState: save_version

                publish_product:
                    from:
                        - Approved
                        - Published
                    to: Published
                    guard: (has_role("ROLE_PIMCORE_ADMIN") or has_role("ROLE_PIMCORE_APPLICATIONADMINCS") or has_role("ROLE_MARCOMCS"))
                    options:
                        label: 'Publish'
                        notes:
                            commentEnabled: true
                            commentRequired: false
                        changePublishedState: force_published

                pause_product:
                    from:
                        - Published
                    to: Paused
                    guard: (has_role("ROLE_PIMCORE_ADMIN") or has_role("ROLE_PIMCORE_APPLICATIONADMINCS") or has_role("ROLE_PRODUCTMANAGERCS"))
                    options:
                        label: 'Pause'
                        notes:
                            commentEnabled: true
                            commentRequired: false
                        changePublishedState: force_published    

                archive_product:
                  from:
                    - Published
                  to: Archived
                  guard: (has_role("ROLE_PIMCORE_ADMIN") or has_role("ROLE_PIMCORE_APPLICATIONADMINCS") or has_role("ROLE_PRODUCTMANAGERCS"))
                  options:
                    label: 'Archive'
                    notes:
                      commentEnabled: true
                      commentRequired: false
                    changePublishedState: force_published                                               
        