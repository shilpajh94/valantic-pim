pimcore:
    workflows:
        product_enrichment:
            label: "Product Workflow"
            type: "state_machine"
            supports:
              - 'Pimcore\Model\DataObject\CSProducts'
            places:
                open:
                    label: Open
                    color: #377ea9
                    permissions:
                        -
#                          objectLayout: 2
                          save: true
                          publish: false
                          delete: false
                          unpublish: false
                          condition: '!(has_role("ROLE_PIMCORE_ADMIN"))'
                in_process:
                    label: In Process
                    color: #377ea9
                    permissions:
                        -
#                          objectLayout: 2
                          save: true
                          publish: false
                          delete: false
                          unpublish: false
                          condition: '!(has_role("ROLE_PIMCORE_ADMIN"))'
                in_rd_edit:
                    label: "In R&D Edit"
                    color: #377ea9
                    permissions:
                        -
#                          objectLayout: 2
                          save: true
                          publish: false
                          delete: false
                          unpublish: false
                          condition: '!(has_role("ROLE_PIMCORE_ADMIN"))'

                in_review:
                    label: In Review
                    color: #377ea9
                    permissions:
                        -
#                          objectLayout: 1
                          save: true
                          publish: false
                          delete: false
                          unpublish: false
                          condition: '!(has_role("ROLE_PIMCORE_ADMIN"))'
                          
                approved:
                    label: Approved
                    color: #377ea9
                    permissions:
                        -
#                          objectLayout: 1
                          save: true
                          publish: false
                          delete: false
                          unpublish: false
                          condition: '!(has_role("ROLE_PIMCORE_ADMIN"))'
                in_publish:
                    label: Sent to Publish
                    color: #377ea9
                    permissions:
                        -
#                          objectLayout: 1
                          save: true
                          publish: false
                          delete: false
                          unpublish: false
                          condition: '!(has_role("ROLE_PIMCORE_ADMIN"))'
                          
                published:
                    label: Published
                    color: #377ea9
                    permissions:
                        -
#                          objectLayout: 1
                          save: true
                          publish: false
                          delete: false
                          unpublish: false
                          condition: '!(has_role("ROLE_PIMCORE_ADMIN"))'

                

                archived:
                    label: Archived
                    color: #377ea9
                    permissions:
                        -
#                          objectLayout: 2
                          save: true
                          publish: false
                          delete: false
                          unpublish: false
                          condition: '!(has_role("ROLE_PIMCORE_ADMIN"))'        

                paused:
                    label: Paused
                    color: #377ea9
                    permissions:
                        -
#                          objectLayout: 2
                          save: true
                          publish: false
                          delete: false
                          unpublish: false
                          condition: '!(has_role("ROLE_PIMCORE_ADMIN"))'
                          
            transitions:
                send_to_process:
                    from:
                        - open
                    to: in_process
                    guard: (has_role("ROLE_PIMCORE_ADMIN") or has_role("ROLE_PIMCORE_APPLICATIONADMINCS") or has_role("ROLE_PRODUCTMANAGERCS"))
                    options:
                        label: 'Send to process'
                        notes:
                            commentEnabled: true
                            commentRequired: false
                        changePublishedState: force_unpublished
#                send_to_edit_again:
#                    from:
#                        - open
#                    to: in_process
#                    guard: (has_role("ROLE_PIMCORE_ADMIN") or has_role("ROLE_PIMCORE_APPLICATIONADMINCS") or has_role("ROLE_PRODUCTMANAGERCS"))
#                    options:
#                        label: 'Send to process'
#                        notes:
#                            commentEnabled: true
#                            commentRequired: false
#                        changePublishedState: force_unpublished
                send_to_edit:
                    from:
                        - in_process
                    to: in_rd_edit
                    guard: (has_role("ROLE_PIMCORE_ADMIN") or has_role("ROLE_PIMCORE_APPLICATIONADMINCS") or has_role("ROLE_PRODUCTMANAGERCS"))
                    options:
                        label: 'Send to R&D Edit'
                        notes:
                            commentEnabled: true
                            commentRequired: false
                        changePublishedState: force_unpublished
                send_for_review:
                    from:
                        - in_rd_edit
                    to: in_review
                    guard: (has_role("ROLE_PIMCORE_ADMIN") or has_role("ROLE_PIMCORE_APPLICATIONADMINCS") or has_role("ROLE_EDITORCS"))
                    options:
                        label: 'Send to review'
                        notes:
                            commentEnabled: true
                            commentRequired: true
                        changePublishedState: force_unpublished
                reject_product:
                    from:
                        - in_review
                    to: in_process
                    guard: (has_role("ROLE_PIMCORE_ADMIN") or has_role("ROLE_PIMCORE_APPLICATIONADMINCS") or has_role("ROLE_MARCOMCS"))
                    options:
                        label: 'Reject'
                        notes:
                            commentEnabled: true
                            commentRequired: true
                        changePublishedState: force_unpublished

                approve_product:
                    from:
                        - in_review
                    to: approved
                    guard: (has_role("ROLE_PIMCORE_ADMIN") or has_role("ROLE_PIMCORE_APPLICATIONADMINCS") or has_role("ROLE_MARCOMCS"))
                    options:
                        label: 'Approve'
                        notes:
                            commentEnabled: true
                            commentRequired: false
                        changePublishedState: save_version
                
                send_to_publish:
                    from:
                        - approved
                    to: in_publish
                    guard: (has_role("ROLE_PIMCORE_ADMIN") or has_role("ROLE_PIMCORE_APPLICATIONADMINCS") or has_role("ROLE_MARCOMCS"))
                    options:
                        label: 'Send to publish'
                        notes:
                            commentEnabled: true
                            commentRequired: true
                        changePublishedState: save_version
                

                publish_product:
                    from:
                        - in_publish
                    to: published
                    guard: (has_role("ROLE_PIMCORE_ADMIN") or has_role("ROLE_PIMCORE_APPLICATIONADMINCS") or has_role("ROLE_PRODUCTMANAGERCS"))
                    options:
                        label: 'Publish'
                        notes:
                            commentEnabled: true
                            commentRequired: false
                        changePublishedState: force_published

                pause_product:
                    from:
                        - published
                    to: paused
                    guard: (has_role("ROLE_PIMCORE_ADMIN") or has_role("ROLE_PIMCORE_APPLICATIONADMINCS") or has_role("ROLE_PRODUCTMANAGERCS"))
                    options:
                        label: 'Pause'
                        notes:
                            commentEnabled: true
                            commentRequired: true
                        changePublishedState: force_unpublished    

                archive_product:
                  from:
                    - published
                  to: archived
                  guard: (has_role("ROLE_PIMCORE_ADMIN") or has_role("ROLE_PIMCORE_APPLICATIONADMINCS") or has_role("ROLE_PRODUCTMANAGERCS"))
                  options:
                    label: 'Archive'
                    notes:
                      commentEnabled: true
                      commentRequired: true
                    changePublishedState: force_unpublished                                               
        