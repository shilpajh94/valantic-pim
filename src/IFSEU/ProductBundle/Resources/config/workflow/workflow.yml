            templatePath: '/Contitech_IFSEU/WorkflowEmailTemplates/Send to Editor for Fixes'
            notificationTo: 
                users:
                    # - ProductManagementIFSEU
                roles:
                    - EditorIFSEU
        in_pm_review:
            templatePath: '/Contitech_IFSEU/WorkflowEmailTemplates/Sent for PM Review'
            notificationTo: 
                users:
                    # - ProductManagementIFSEU
                roles:
                     - ProductManagementIFSEU
    transition: 
        send_to_marcom:
