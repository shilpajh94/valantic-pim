parameters:
    b2b_auth:
        url: '%env(resolve:B2B_AUTH_URL)%'
        method: POST
        params:
            client_id: '%env(resolve:B2B_AUTH_CLIENT_ID)%'
            client_secret: '%env(resolve:B2B_AUTH_CLIENT_SECRET)%'
            username: '%env(resolve:B2B_AUTH_USERNAME)%'
            password: '%env(resolve:B2B_AUTH_PASSWORD)%'
            grant_type: password
        token_lifetime: 1740
        guzzle_request_timeout: 10
        content_type: application/x-www-form-urlencoded