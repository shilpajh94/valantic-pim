services:
    # default configuration for services in *this* file
    _defaults:
        # automatically injects dependencies in your services
        autowire: true
        # automatically registers your services as commands, event subscribers, etc.
        autoconfigure: true
        # this means you cannot fetch services directly from the container via $container->get()
        # if you need to do this, you can override this setting on individual services
        public: false

    Symfony\Component\DependencyInjection\ContainerInterface: '@service_container'

    App\EventListener\Admin\AdminStyleListener:
        tags:
            - { name: kernel.event_listener, event: pimcore.admin.resolve.elementAdminStyle, method: onResolveElementAdminStyle }

    App\EventListener\Admin\AdminAssetsListener:
        tags:
            - { name: kernel.event_listener, event: pimcore.bundle_manager.paths.js, method: onJsPaths }

    App\Model\CalculatedValue\ProductManagement\:
        resource: '../src/Model/CalculatedValue/ProductManagement'
        public: true

