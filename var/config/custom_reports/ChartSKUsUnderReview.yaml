pimcore_custom_reports:
    definitions:
        ChartSKUsUnderReview:
            name: ChartSKUsUnderReview
            sql: ''
            dataSourceConfig:
                -
                    sql: "SELECT count(o1.`id`) AS `# of SKUs`, \nCASE\n    WHEN  w.`place` = 'enrich' OR w.`place` is null  THEN 'Enrich Product'\n    WHEN  w.`place` = 'review_content' THEN 'Review Enriched Data'\n    WHEN  w.`place` = 'unpublished' THEN 'Product Unpublished'\n    WHEN  w.`place` = 'accepted' THEN 'Product Published'\n    ELSE \"\"\nEND AS `Status` "
                    from: "FROM object_1 o1 \nleft JOIN element_workflow_state w ON o1.oo_id = w.cid "
                    where: ''
                    groupby: 'GROUP BY `Status`'
                    type: sql
            columnConfiguration:
                -
                    name: '# of SKUs'
                    display: true
                    export: true
                    order: true
                    width: ''
                    label: ''
                    id: extModel2419-1
                -
                    name: Status
                    display: true
                    export: true
                    order: true
                    width: ''
                    label: ''
                    id: extModel2419-2
            niceName: 'Chart - SKUs Workflow Status'
            group: ''
            groupIconClass: ''
            iconClass: ''
            menuShortcut: false
            reportClass: ''
            chartType: ''
            pieColumn: null
            pieLabelColumn: null
            xAxis: null
            yAxis: {  }
            modificationDate: 1708344932
            creationDate: 1708243186
            shareGlobally: true
            sharedUserNames: {  }
            sharedRoleNames: {  }
