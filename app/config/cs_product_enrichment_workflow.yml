pimcore:
    workflows:
        product_enrichment:
            label: "Product Workflow"
            type: "state_machine"
            supports:
              - 'Pimcore\Model\DataObject\CSProducts'
            places:
                open:
                    label: Open
                    color: #377ea9
                    permissions:
                        -
#                          objectLayout: 2
                          save: true
                          publish: false
                          delete: false
                          unpublish: false
                          condition: '!(has_role("ROLE_PIMCORE_ADMIN"))'
                in_process:
                    label: In Process
                    color: #377ea9
                    permissions:
                        -
#                          objectLayout: 2
                          save: true
                          publish: false
                          delete: false
                          unpublish: false
                          condition: '!(has_role("ROLE_PIMCORE_ADMIN"))'
                in_rd_edit:
                    label: "In R&D Edit"
                    color: #377ea9
                    permissions:
                        -
#                          objectLayout: 2
                          save: true
                          publish: false
                          delete: false
                          unpublish: false
                          condition: '!(has_role("ROLE_PIMCORE_ADMIN"))'

                in_marcom_edit:
                    label: In Marcom Edit
                    color: #377ea9
                    permissions:
                        -
#                          objectLayout: 1
                          save: true
                          publish: false
                          delete: false
                          unpublish: false
                          condition: '!(has_role("ROLE_PIMCORE_ADMIN"))'
                          
                in_publish:
                    label: Sent to PO for Review
                    color: #377ea9
                    permissions:
                        -
#                          objectLayout: 1
                          save: true
                          publish: false
                          delete: false
                          unpublish: false
                          condition: '!(has_role("ROLE_PIMCORE_ADMIN"))'
                          
                published:
                    label: Published
                    color: #377ea9
                    permissions:
                        -
#                          objectLayout: 1
                          save: true
                          publish: false
                          delete: false
                          unpublish: false
                          condition: '!(has_role("ROLE_PIMCORE_ADMIN"))'

                

                archived:
                    label: Archived
                    color: #377ea9
                    permissions:
                        -
#                          objectLayout: 2
                          save: true
                          publish: false
                          delete: false
                          unpublish: false
                          condition: '!(has_role("ROLE_PIMCORE_ADMIN"))'        

                paused:
                    label: Paused
                    color: #377ea9
                    permissions:
                        -
#                          objectLayout: 2
                          save: true
                          publish: false
                          delete: false
                          unpublish: false
                          condition: '!(has_role("ROLE_PIMCORE_ADMIN"))'
                          
            transitions:
                send_to_process:
                    from:
                        - open
                    to: in_process
                    guard: ((has_role("ROLE_PIMCORE_ADMIN") or has_role("ROLE_PIMCORE_APPLICATIONADMINCS") or has_role("ROLE_PRODUCTMANAGERCS")) and (subject.getProductOwner() != null and subject.getProductOwner() != ''))
                    options:
                        label: 'Send to process'
                        notes:
                            commentEnabled: true
                            commentRequired: false
                        changePublishedState: save_version
                send_to_edit:
                    from:
                        - paused
                        - published
                        - in_process
                    to: in_rd_edit
                    guard: ((has_role("ROLE_PIMCORE_ADMIN") or has_role("ROLE_PIMCORE_APPLICATIONADMINCS") or has_role("ROLE_PRODUCTMANAGERCS")) and (subject.getProductOwner() == user.getId()) and (subject.getRnDUser() != null and subject.getRnDUser() != ''))
                    options:
                        label: 'Send to R&D Edit'
                        notes:
                            commentEnabled: true
                            commentRequired: false
                        changePublishedState: save_version
                        
                send_to_marcom:
                    from:
                        #- published
                        - in_rd_edit
                    to: in_marcom_edit
                    guard: ((has_role("ROLE_PIMCORE_ADMIN") or has_role("ROLE_PIMCORE_APPLICATIONADMINCS") or has_role("ROLE_PRODUCTMANAGERCS") or has_role("ROLE_EDITORCS")) and (subject.getMarcomUser() != null and subject.getMarcomUser() != ''))
                    options:
                        label: 'Send for Enrichment To Marcom'
                        notes:
                            commentEnabled: true
                            commentRequired: true
                        changePublishedState: save_version
                send_to_publish:
                    from:
                        - in_marcom_edit
                    to: in_publish
                    guard: ((has_role("ROLE_PIMCORE_ADMIN") or has_role("ROLE_PIMCORE_APPLICATIONADMINCS") or has_role("ROLE_MARCOMCS")) and (subject.getProductOwner() != null and subject.getProductOwner() != ''))
                    options:
                        label: 'Send to PO for Review'
                        notes:
                            commentEnabled: true
                            commentRequired: true
                        changePublishedState: save_version
#                reject_to_po:
#                    from:
#                        - in_publish
#                    to: in_process
#                    guard: ((has_role("ROLE_PIMCORE_ADMIN") or has_role("ROLE_PIMCORE_APPLICATIONADMINCS") or has_role("ROLE_PRODUCTMANAGERCS")) and (subject.getProductOwner() == user.getId()) and (subject.getProductOwner() != null and subject.getProductOwner() != ''))
#                    options:
#                        label: 'Reset'
#                        notes:
#                            commentEnabled: true
#                            commentRequired: true
#                        changePublishedState: save_version
                reject_to_rnd:
                    from:
                        - in_publish
                    to: in_rd_edit
                    guard: ((has_role("ROLE_PIMCORE_ADMIN") or has_role("ROLE_PIMCORE_APPLICATIONADMINCS") or has_role("ROLE_PRODUCTMANAGERCS")) and (subject.getProductOwner() == user.getId()) and (subject.getRnDUser() != null and subject.getRnDUser() != ''))
                    options:
                        label: 'Send for fixes to R&D'
                        notes:
                            commentEnabled: true
                            commentRequired: true
                        changePublishedState: save_version
                reject_to_marcom:
                    from:
                        - in_publish
                    to: in_marcom_edit
                    guard: ((has_role("ROLE_PIMCORE_ADMIN") or has_role("ROLE_PIMCORE_APPLICATIONADMINCS") or has_role("ROLE_PRODUCTMANAGERCS")) and (subject.getProductOwner() == user.getId()) and (subject.getMarcomUser() != null and subject.getMarcomUser() != ''))
                    options:
                        label: 'Send for fixes to Marcom'
                        notes:
                            commentEnabled: true
                            commentRequired: true
                        changePublishedState: save_version
                

                publish_product:
                    from:
                        - in_publish
                    to: published
                    guard: ((has_role("ROLE_PIMCORE_ADMIN") or has_role("ROLE_PIMCORE_APPLICATIONADMINCS") or has_role("ROLE_PRODUCTMANAGERCS")) and (subject.getProductOwner() == user.getId()))
                    options:
                        label: 'Publish'
                        notes:
                            commentEnabled: true
                            commentRequired: false
                        changePublishedState: force_published

                pause_product:
                    from:
                        - published
                    to: paused
                    guard: (has_role("ROLE_PIMCORE_ADMIN") or has_role("ROLE_PIMCORE_APPLICATIONADMINCS")) or (has_role("ROLE_PRODUCTMANAGERCS") and (subject.getProductOwner() == user.getId()))
                    options:
                        label: 'Pause'
                        notes:
                            commentEnabled: true
                            commentRequired: true
                        changePublishedState: force_unpublished    

                archive_product:
                    from:
                        - published
                    to: archived
                    guard: (has_role("ROLE_PIMCORE_ADMIN") or has_role("ROLE_PIMCORE_APPLICATIONADMINCS")) or (has_role("ROLE_PRODUCTMANAGERCS") and (subject.getProductOwner() == user.getId()))
                    options:
                        label: 'Archive'
                        notes:
                            commentEnabled: true
                            commentRequired: true
                        changePublishedState: force_unpublished                                               
        
