# sheet: Sheet Information
#     columnName: ['material', 'language', 'description', 'group', 'code',
#             'baseUOM', 'oldMaterial', 'prodHier1', 'prodHier1Desc', 'prodHier2', 'prodHier2Desc',
#             'prodHier3', 'prodHier3Desc', 'prodHier4', 'prodHier4Desc', 'prodHier5', 'prodHier5Desc',
#             'prodHier6', 'prodHier6Desc', 'industryStandard', 'manufacture', 'manufacturePartNumber',
#             'eanUPC', 'stccCode'] List of column name which will be map with row of sheet
#     lastColName: 'D' // Last column of the sheet which will be used to log row status of the sheet
#     startRow: 2 // Row number to start the reading sheet
#     importIdConfig: ['material'] // This field will be used to create primary key structure of temp table. Ref: TableImport.php insertTempData()


parameters:
  # Csv header information
  sheet:
    columnName: 
      material: 'Material'
      language: 'Language'
      description:  'Material Description'
      group:  'Material Group'
      code: 'Prod Hier'
      baseUOM:  'Base UOM'
      oldMaterial:  'Old Material'
      prodHier1:  'Prod Hier 1'
      prodHier1Desc:  'Prod Hier 1 Desc'
      prodHier2:  'Prod Hier 2'
      prodHier2Desc:  'Prod Hier 2 Desc'
      prodHier3:  'Prod Hier 3'
      prodHier3Desc:  'Prod Hier 3 Desc'
      prodHier4:  'Prod Hier 4'
      prodHier4Desc:  'Prod Hier 4 Desc'
      prodHier5:  'Prod Hier 5'
      prodHier5Desc:  'Prod Hier 5 Desc'
      prodHier6:  'Prod Hier 6'
      prodHier6Desc:  'Prod Hier 6 Desc'
      industryStandard: 'Industry Standard #'
      manufacture:  'Manufacter'
      manufacturePartNumber:  'Manufacter Part Numb'
      eanUPC: 'EAN_UPC'
      stccCode: 'STCC Code'
      delationFlag: 'Deletion Flag'
      grossWeight:  'Gross Weight'
      netWeight:  'Net Weight'
      weightUnit: 'Weight Unit'
      externalID: 'External ID'
      descriptionS: 'Material Desc S'
      descriptionP: 'Material Desc  P'

    lastColName: 'AE'
    startRow: 1
    readFrom: 2
    keyColumns: ['material']
    baseSIOPMismatchEmailTemplate: "/EmailTemplate/SIOPMismatchReport"
  
  # Root information
  root:
    type: 'dataObject'
    subType:  'object'
    fullPath: '/Products Master'
    id: 2
  
  # Base / Brand info
  base:
    length: 6

  # Skeleton / Product Specification info
  skeleton:
    length: 9

  # Variant (SKU) info
  variant:
    length: 14
    
  # Product Type
  productType:
    6:  'base'
    9:  'skeleton'
    14: 'fert'

  # SIOP Code Level Info
  level:
    1:  
      codeLength: 2
      fullCodeLength: 2
      key: 'prodHier1Desc'
    2:  
      codeLength: 4
      fullCodeLength: 6
      key: 'prodHier2Desc'
    3:  
      codeLength: 4
      fullCodeLength: 10
      key: 'prodHier3Desc'
    4:  
      codeLength: 3
      fullCodeLength: 13
      key: 'prodHier4Desc'
    5:  
      codeLength: 3
      fullCodeLength: 16
      key: 'prodHier5Desc'
    6:  
      codeLength: 2
      fullCodeLength: 18
      key: 'prodHier6Desc'

  # List of table which will use while import
  table:
      tempTable: 'material_import_temp'
      masterTable:  'material_import_master'
      logTable: 'material_import_log'

  # Number of level allowed to create into SAP hierarchy for SIOP
  allowedLevel:
    PTG: 4
    IFS: 4
  # Mapping product type on siop level 5 & 8. In PTG case only
  # productTypeLevel 
  #   5:  6 --- 5 is SIOP level and 6 is stand for 6 digit product type
  #   6:  9 --- 6 is SIOP level and 9 is stand for 9 digit product type
  productTypeLevel:
    5:  6
    6:  9
  
  # Product level allowed to business unit
  # Business Unit code 1500 and 3000 are outside purchased product. So, ignore to create base and skeleton
  levelAllowedForBUCode:
    1000: ['base', 'skeleton', 'fert']
    1500: ['fert']
    3000: ['fert']