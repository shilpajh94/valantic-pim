pimcore:
    workflows:
        product_enrichment:
            label: "Product Workflow"
            type: "state_machine"
            initial_markings:     ["open"]
            supports:
              - 'Pimcore\Model\DataObject\CSProducts'
            places:
                open:
                    label: Open
                    color: #377ea9
                    permissions:
                        -
#                          objectLayout: 2
                          save: true
                          publish: false
                          delete: false
                          unpublish: false
                          condition: '!(("ROLE_PIMCORE_ADMIN") in role_names)'
                in_po_edit:
                    label: In PO Edit
                    color: #377ea9
                    permissions:
                        -
#                          objectLayout: 2
                          save: true
                          publish: false
                          delete: false
                          unpublish: false
                          condition: '!(("ROLE_PIMCORE_ADMIN") in role_names)'
                in_rd_edit:
                    label: "In R&D Edit"
                    color: #377ea9
                    permissions:
                        -
#                          objectLayout: 2
                          save: true
                          publish: false
                          delete: false
                          unpublish: false
                          condition: '!(("ROLE_PIMCORE_ADMIN") in role_names)'

                in_marcom_edit:
                    label: In Marcom Edit
                    color: #377ea9
                    permissions:
                        -
#                          objectLayout: 1
                          save: true
                          publish: false
                          delete: false
                          unpublish: false
                          condition: '!(("ROLE_PIMCORE_ADMIN") in role_names)'
                          
                in_publish:
                    label: Sent to PO for Review
                    color: #377ea9
                    permissions:
                        -
#                          objectLayout: 1
                          save: true
                          publish: false
                          delete: false
                          unpublish: false
                          condition: '!(("ROLE_PIMCORE_ADMIN") in role_names)'
                          
                published:
                    label: Published
                    color: #377ea9
                    permissions:
                        -
#                          objectLayout: 1
                          save: true
                          publish: false
                          delete: false
                          unpublish: false
                          condition: '!(("ROLE_PIMCORE_ADMIN") in role_names)'

                

                archived:
                    label: Archived
                    color: #377ea9
                    permissions:
                        -
#                          objectLayout: 2
                          save: true
                          publish: false
                          delete: false
                          unpublish: false
                          condition: '!(("ROLE_PIMCORE_ADMIN") in role_names)'        

                paused:
                    label: Paused
                    color: #377ea9
                    permissions:
                        -
#                          objectLayout: 2
                          save: true
                          publish: false
                          delete: false
                          unpublish: false
                          condition: '!(("ROLE_PIMCORE_ADMIN") in role_names)'
                          
            transitions:
                direct_publish:
                    from:
                        - open
                    to: published
                    guard: (user.getId() == '0') 
                    options:
                        label: 'Publish'
                        changePublishedState: force_published

                send_to_process:
                    from:
                        - open
                    to: in_po_edit
                    guard: ((subject.setGetInheritedValues(true) or ("ROLE_PIMCORE_ADMIN") in role_names or ("ROLE_APPLICATIONADMINCS") in role_names or ("ROLE_PRODUCTMANAGERCS") in role_names) and (subject.getProductOwner() != null and subject.getProductOwner() != ''))
                    options:
                        label: 'Send to PO for Edit'
                        notes:
                            commentEnabled: true
                            commentRequired: true
                        changePublishedState: save_version
                send_to_edit:
                    from:
                        - paused
                        - published
                        - in_po_edit
                        - in_marcom_edit
                    to: in_rd_edit
                    guard: ((subject.setGetInheritedValues(true) or ("ROLE_PIMCORE_ADMIN") in role_names or ("ROLE_APPLICATIONADMINCS") in role_names or ("ROLE_MARCOMCS") in role_names or ("ROLE_PRODUCTMANAGERCS") in role_names) and (subject.getProductOwner() != null and subject.getProductOwner() != '') and (subject.getPublished() == true || subject.getPublished() == 1))                    
                    options:
                        label: 'Send To R&D for Enrichment'
                        notes:
                            commentEnabled: true
                            commentRequired: true
                        changePublishedState: save_version
                send_to_marcom:
                    from:
                        - published
                        - in_rd_edit
                    to: in_marcom_edit
                    guard: ((subject.setGetInheritedValues(true) or ("ROLE_PIMCORE_ADMIN") in role_names or ("ROLE_APPLICATIONADMINCS") in role_names or ("ROLE_EDITORCS") in role_names or ("ROLE_PRODUCTMANAGERCS") in role_names) and (subject.getProductOwner() != null and subject.getProductOwner() != '') and (subject.getPublished() == true || subject.getPublished() == 1))                    
                    options:
                        label: 'Send To Marcom for Enrichment'
                        notes:
                            commentEnabled: true
                            commentRequired: true
                        changePublishedState: save_version
                # send_to_edit_for_enrichment:
                #     from:
                #         - published
                #         - in_marcom_edit
                #     to: in_rd_edit
                #     guard: ((subject.setGetInheritedValues(true) or has_role("ROLE_PIMCORE_ADMIN") or has_role("ROLE_APPLICATIONADMINCS") or has_role("ROLE_MARCOMCS")) and (subject.getRnDUser() != null and subject.getRnDUser() != ''))
                #     options:
                #         label: 'Send To R&D Edit'
                #         notes:
                #             commentEnabled: true
                #             commentRequired: true
                #         changePublishedState: save_version
                send_to_publish:
                    from:
                        - in_marcom_edit
                    to: in_publish
                    guard: ((subject.setGetInheritedValues(true) or ("ROLE_PIMCORE_ADMIN") in role_names or ("ROLE_APPLICATIONADMINCS") in role_names or ("ROLE_MARCOMCS") in role_names) and (subject.getProductOwner() != null and subject.getProductOwner() != ''))
                    options:
                        label: 'Send to PO for Review'
                        notes:
                            commentEnabled: true
                            commentRequired: true
                        changePublishedState: save_version
#                reject_to_po:
#                    from:
#                        - in_publish
#                    to: in_process
#                    guard: ((has_role("ROLE_PIMCORE_ADMIN") or has_role("ROLE_APPLICATIONADMINCS") or has_role("ROLE_PRODUCTMANAGERCS")) and (subject.getProductOwner() == user.getId()) and (subject.getProductOwner() != null and subject.getProductOwner() != ''))
#                    options:
#                        label: 'Reset'
#                        notes:
#                            commentEnabled: true
#                            commentRequired: true
#                        changePublishedState: save_version
                reject_to_rnd:
                    from:
                        - in_publish
                        - published
                    to: in_rd_edit
                    guard: ((subject.setGetInheritedValues(true) or ("ROLE_PIMCORE_ADMIN") in role_names or ("ROLE_APPLICATIONADMINCS") or ("ROLE_PRODUCTMANAGERCS") in role_names) in role_names and (subject.getProductOwner() != null and subject.getProductOwner() != '') and (subject.getPublished() == true || subject.getPublished() == 1))                    
                    options:
                        label: 'Send to R&D for fixes '
                        notes:
                            commentEnabled: true
                            commentRequired: true
                        changePublishedState: save_version
                reject_to_marcom:
                    from:
                        - in_publish
                        - published
                    to: in_marcom_edit
                    guard: ((subject.setGetInheritedValues(true) or ("ROLE_PIMCORE_ADMIN") in role_names or ("ROLE_APPLICATIONADMINCS") in role_names or ("ROLE_PRODUCTMANAGERCS") in role_names) and (subject.getProductOwner() == user.getId()) and (subject.getMarcomUser() != null and subject.getMarcomUser() != ''))
                    options:
                        label: 'Send to Marcom for fixes '
                        notes:
                            commentEnabled: true
                            commentRequired: true
                        changePublishedState: save_version
                

                publish_product:
                    from:
                        - published
                        - in_publish
                    to: published
                    guard: ((subject.setGetInheritedValues(true) or ("ROLE_PIMCORE_ADMIN") in role_names or ("ROLE_APPLICATIONADMINCS") in role_names or ("ROLE_PRODUCTMANAGERCS") in role_names) and (subject.getProductOwner() == user.getId()))
                    options:
                        label: 'Publish'
                        notes:
                            commentEnabled: true
                            commentRequired: true
                        changePublishedState: force_published
                        
                # after publishing transitions
#                send_to_edit_after_publish:
#                    from:
##                        - paused
#                        - published
#                        - in_po_edit
#                    to: in_rd_edit
#                    guard: ((has_role("ROLE_PIMCORE_ADMIN") or has_role("ROLE_APPLICATIONADMINCS") or has_role("ROLE_PRODUCTMANAGERCS")) and (subject.getProductOwner() == user.getId()) and (subject.getRnDUser() != null and subject.getRnDUser() != ''))
#                    options:
#                        label: 'Send to R&D Edit'
#                        notes:
#                            commentEnabled: true
#                            commentRequired: false
#                        changePublishedState: save_version
                # send_to_marcom_after_publish:
                #     from:
                #         - published
                #     to: in_marcom_edit
                #     guard: ((subject.setGetInheritedValues(true) or has_role("ROLE_PIMCORE_ADMIN") or has_role("ROLE_APPLICATIONADMINCS") or has_role("ROLE_PRODUCTMANAGERCS")) and (subject.getProductOwner() == user.getId()) and (subject.getMarcomUser() != null and subject.getMarcomUser() != '') and (subject.getPublished() == true || subject.getPublished() == 1))
                #     options:
                #         label: 'Send for Enrichment To Marcom'
                #         notes:
                #             commentEnabled: true
                #             commentRequired: true
                #         changePublishedState: save_version       
                send_to_po_for_review:
                    from:
                        - published
                        - in_rd_edit
                    to: in_publish
                    guard: ((subject.setGetInheritedValues(true) or ("ROLE_PIMCORE_ADMIN") in role_names or ("ROLE_APPLICATIONADMINCS") in role_names or ("ROLE_EDITORCS") in role_names or ("ROLE_MARCOMCS") in role_names) and (subject.getProductOwner() != null and subject.getProductOwner() != '') and (subject.getPublished() == true || subject.getPublished() == 1))
                    options:
                        label: 'Send to PO for Review'
                        notes:
                            commentEnabled: true
                            commentRequired: true
                        changePublishedState: save_version
                # send_to_po_for_review_from_rd_edit:
                #     from:
                #         - in_rd_edit
                #     to: in_publish
                #     guard: ((subject.setGetInheritedValues(true) or has_role("ROLE_PIMCORE_ADMIN") or has_role("ROLE_APPLICATIONADMINCS") or has_role("ROLE_EDITORCS")) and (subject.getProductOwner() != null and subject.getProductOwner() != ''))
                #     options:
                #         label: 'Send to PO for Review'
                #         notes:
                #             commentEnabled: true
                #             commentRequired: true
                #         changePublishedState: save_version
                        
                # after publishing transitions       
                        
                pause_product:
                    from:
                        - published
                    to: paused
                    guard: ((subject.setGetInheritedValues(true) or ("ROLE_PIMCORE_ADMIN") in role_names or ("ROLE_APPLICATIONADMINCS") in role_names or ("ROLE_PRODUCTMANAGERCS") in role_names) and (subject.getProductOwner() == user.getId()))
                    options:
                        label: 'Pause'
                        notes:
                            commentEnabled: true
                            commentRequired: true
                        changePublishedState: force_unpublished    

                archive_product:
                    from:
                        - published
                    to: archived
                    guard: ((subject.setGetInheritedValues(true) or ("ROLE_PIMCORE_ADMIN") in role_names or ("ROLE_APPLICATIONADMINCS") in role_names or ("ROLE_PRODUCTMANAGERCS") in role_names) and (subject.getProductOwner() == user.getId()))
                    options:
                        label: 'Archive'
                        notes:
                            commentEnabled: true
                            commentRequired: true
                        changePublishedState: force_unpublished                                               
        