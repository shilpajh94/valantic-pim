services:
    # default configuration for services in *this* file
    _defaults:
        # automatically injects dependencies in your services
        autowire: true
        # automatically registers your services as commands, event subscribers, etc.
        autoconfigure: true
        # this means you cannot fetch services directly from the container via $container->get()
        # if you need to do this, you can override this setting on individual services
        public: false
        
    # Add listener to manipulate data object while saving it
    AppBundle\EventListener\ObjectListener:
        tags:
            - { name: kernel.event_listener, event: pimcore.admin.dataobject.get.preSendData, method: beforeOpenObject }
            
    AppBundle\EventListener\AdminAssetsListener:
        tags:
                - { name: kernel.event_subscriber }
    #
    # CONTROLLERS
    #

    # auto-register all controllers as services
    AppBundle\Controller\:
        resource: '../../Controller'
        public: true
        tags: ['controller.service_arguments']


    #
    # COMMANDS
    #

    # auto-register all commands as services
    AppBundle\Command\:
        resource: '../../Command/*'
        tags: ['console.command']
        
    # Services
    # this service will be common throughout the project
    app.common_helper:
        class: AppBundle\Helper\Common
        public: true

    # Global category helper
    app.category_helper:
        class: AppBundle\Helper\Category
        public: true
      

    # Pim catgory(SIOP) class
    pim.category_service:
        class: Pimcore\Model\DataObject\ProductCategory
        public: true

    # Pim category listing class
    pim.category_listing_service:
        class: Pimcore\Model\DataObject\ProductCategory\Listing
        public: true

    
    app.config_provider_service:
        class: AppBundle\Services\ConfigProviderService
        public: true
