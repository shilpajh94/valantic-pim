pimcore_custom_reports:
    definitions:
        HydraulicHoseChartNewProduct11:
            name: HydraulicHoseChartNewProduct11
            sql: ''
            dataSourceConfig:
                -
                    sql: 'SELECT MONTHNAME(FROM_UNIXTIME(o1.`creationDate`)) AS `Month`, IF(Count(*),Count(*),0) AS `# of SKUs`  '
                    from: "FROM object_1 o1 \n"
                    where: "WHERE (o1.siopFullCode LIKE '0415001540%' OR o1.siopFullCode LIKE '0415001550%' OR o1.siopFullCode LIKE '0415001560%' OR o1.siopFullCode LIKE '0415001530000%' OR o1.siopFullCode LIKE '0415001510000%') AND (o1.`creationDate` >= MONTH(CURDATE() - Interval 9 month))  "
                    groupby: 'GROUP BY MONTHNAME(FROM_UNIXTIME(o1.`creationDate`)) order by o1.`creationDate` '
                    type: sql
            columnConfiguration:
                -
                    name: Month
                    display: true
                    export: true
                    order: true
                    width: ''
                    label: ''
                    id: extModel6695-3
                -
                    name: '# of SKUs'
                    display: true
                    export: true
                    order: true
                    width: ''
                    label: ''
                    id: extModel6695-4
            niceName: 'Chart - New Products 11'
            group: 'Hydraulic Hose'
            groupIconClass: ''
            iconClass: ''
            menuShortcut: false
            reportClass: ''
            chartType: bar
            pieColumn: null
            pieLabelColumn: null
            xAxis: Month
            yAxis:
                - '# of SKUs'
            modificationDate: 1708261384
            creationDate: 1708254749
            shareGlobally: true
            sharedUserNames: {  }
            sharedRoleNames: {  }
