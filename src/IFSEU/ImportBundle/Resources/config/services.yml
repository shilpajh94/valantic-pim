services:
    # default configuration for services in *this* file
    _defaults:
        # automatically injects dependencies in your services
        autowire: true
        # automatically registers your services as commands, event subscribers, etc.
        autoconfigure: true
        # this means you cannot fetch services directly from the container via $container->get()
        # if you need to do this, you can override this setting on individual services
        public: false

    # controllers are imported separately to make sure they're public
    # and have a tag that allows actions to type-hint services
    IFSEU\ImportBundle\Controller\:
        resource: '../../Controller'
        public: true
        tags: ['controller.service_arguments']

# add more services, or override services that need manual wiring
#    IFSEU\ImportBundle\ExampleClass:
#        arguments:
#            - "@service_id"
#            - "plain_value"
#            - "%parameter%"

    # this command will execute the import of SAP plant material
    IFSEU\ImportBundle\Command\IFSEU_SAPPlantMaterialImportCommand:
        tags:
            - { name: 'console.command', command: 'contitech:ifs:eu:sap-plant-material-import' }

    IFSEU\ImportBundle\Command\IFSEU_SAPSalesMaterialImportCommand:
        tags:
            - { name: 'console.command', command: 'contitech:ifs:eu:sap-sales-material-import' }

    IFSEU\ImportBundle\Command\IFSEU_SAPProductImportCommand:
        tags:
            - { name: 'console.command', command: 'contitech:ifs:eu:sap-product-import' }
    
    ifs_eu_import.sap_plant_material_import:
        class: IFSEU\ImportBundle\Services\PlantMaterialService
        public: true

    ifs_eu_import.sap_sales_material_import:
        class: IFSEU\ImportBundle\Services\SalesMaterialService
        public: true

    # Helpers
    ifs_eu_import.common_helper:
        class: IFSEU\ImportBundle\Helper\Common
        public: true

    
    # Services
    ifs_eu_import.sap_file_feeder_service:
        class: IFSEU\ImportBundle\Services\SAPFileFeederService
        public: true

    ifs_eu_import.config_provider_service:
        class: IFSEU\ImportBundle\Services\ConfigProviderService
        public: true
