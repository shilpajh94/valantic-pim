pimcore_custom_reports:
    definitions:
        HydraulicHoseChartBrandProduct:
            name: HydraulicHoseChartBrandProduct
            sql: ''
            dataSourceConfig:
                -
                    sql: 'SELECT cat4.`description` AS `SIOP Level 4`, o3.`name` AS `Brand`, count(`o1`.`id`) AS `# of SKUs`'
                    from: 'FROM object_1 o1 LEFT JOIN object_3 o3 ON o3.`oo_id` = o1.brandName LEFT JOIN object_localized_query_2_en cat4 ON cat4.ooo_id = SUBSTRING(o1.SIOPLevel4,2,(LENGTH(o1.SIOPLevel4) - 2)) '
                    where: "WHERE (o1.`published` =1 AND (o1.siopFullCode LIKE '0415001540%' OR o1.siopFullCode LIKE '0415001550%' OR o1.siopFullCode LIKE '0415001560%' OR o1.siopFullCode LIKE '0415001530000%' OR o1.siopFullCode LIKE '0415001510000%'))  "
                    groupby: 'GROUP BY cat4.`description`,  o3.`name`'
                    type: sql
            columnConfiguration:
                -
                    name: 'SIOP Level 4'
                    display: true
                    export: true
                    order: true
                    width: ''
                    label: ''
                    id: extModel5399-3
                -
                    name: Brand
                    display: true
                    export: true
                    order: true
                    width: ''
                    label: ''
                    id: extModel5399-4
                -
                    name: '# of SKUs'
                    display: true
                    export: true
                    order: true
                    width: ''
                    label: ''
                    id: extModel5399-5
            niceName: 'Chart - Brand Product'
            group: 'Hydraulic Hose'
            groupIconClass: ''
            iconClass: ''
            menuShortcut: false
            reportClass: ''
            chartType: pie
            pieColumn: '# of SKUs'
            pieLabelColumn: Brand
            xAxis: null
            yAxis: {  }
            modificationDate: 1708342949
            creationDate: 1708253799
            shareGlobally: true
            sharedUserNames: {  }
            sharedRoleNames: {  }
