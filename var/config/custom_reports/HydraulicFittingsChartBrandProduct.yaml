pimcore_custom_reports:
    definitions:
        HydraulicFittingsChartBrandProduct:
            name: HydraulicFittingsChartBrandProduct
            sql: ''
            dataSourceConfig:
                -
                    sql: 'SELECT cat4.`description` AS `SIOP Level 4`, o3.`name` AS `Brand`, count(`o1`.`id`) AS `# of SKUs` '
                    from: 'FROM object_1 o1 LEFT JOIN object_3 o3 ON o3.`oo_id` = o1.brandName LEFT JOIN object_localized_query_2_en cat4 ON cat4.ooo_id = SUBSTRING(o1.SIOPLevel4,2,(LENGTH(o1.SIOPLevel4) - 2))  '
                    where: "WHERE (o1.`published` =1 AND (o1.siopFullCode LIKE '0415001570%' OR o1.siopFullCode LIKE  '0415001580%' OR o1.siopFullCode LIKE '0415001530100%' OR o1.siopFullCode LIKE '0415001510100%')) "
                    groupby: 'GROUP BY cat4.`description`, o3.`name`'
                    type: sql
            columnConfiguration:
                -
                    name: 'SIOP Level 4'
                    display: true
                    export: true
                    order: true
                    width: ''
                    label: ''
                    id: extModel6901-3
                -
                    name: Brand
                    display: true
                    export: true
                    order: true
                    width: ''
                    label: ''
                    id: extModel6901-4
                -
                    name: '# of SKUs'
                    display: true
                    export: true
                    order: true
                    width: ''
                    label: ''
                    id: extModel6901-5
            niceName: 'Chart - Brand Product'
            group: 'Hydraulic Fittings'
            groupIconClass: ''
            iconClass: ''
            menuShortcut: false
            reportClass: ''
            chartType: pie
            pieColumn: '# of SKUs'
            pieLabelColumn: Brand
            xAxis: null
            yAxis: {  }
            modificationDate: 1708343677
            creationDate: 1708245920
            shareGlobally: true
            sharedUserNames: {  }
            sharedRoleNames: {  }
