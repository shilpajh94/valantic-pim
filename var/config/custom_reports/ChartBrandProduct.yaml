pimcore_custom_reports:
    definitions:
        ChartBrandProduct:
            name: ChartBrandProduct
            sql: ''
            dataSourceConfig:
                -
                    sql: "SELECT cat4.`description` AS `SIOP Level 4`, o3.`name` AS `Brand`,  \ncount(`o1`.`id`) AS `# of SKUs`"
                    from: "FROM\nobject_1 o1\nLEFT JOIN object_3 o3 \n\tON o3.`oo_id` = o1.brandName\nLEFT JOIN object_localized_query_2_en cat4 \n\tON cat4.ooo_id = SUBSTRING(o1.SIOPLevel4,2,(LENGTH(o1.SIOPLevel4) - 2))"
                    where: 'WHERE (o1.`published` =1) '
                    groupby: ''
                    type: sql
            columnConfiguration:
                -
                    name: 'SIOP Level 4'
                    display: true
                    export: true
                    order: true
                    width: ''
                    label: ''
                    id: extModel2722-1
                -
                    name: Brand
                    display: true
                    export: true
                    order: true
                    width: ''
                    label: ''
                    id: extModel2722-2
                -
                    name: '# of SKUs'
                    display: true
                    export: true
                    order: true
                    width: ''
                    label: ''
                    id: extModel2722-3
            niceName: 'Chart - Brand Product'
            group: ''
            groupIconClass: ''
