pimcore:
  workflows:
    !php/enum App\Enum\ProductManagement\ProductApprovalWorkflow::PRODUCT_APPROVAL->value:
      label: "Product Approval Workflow"
      type: state_machine
      marking_store:
        type: single_state
        arguments:
          - approvalState
      initial_markings: [!php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::IMPORTED_DISPLAYED->value]
      places:
        SAP:
          label: 'SAP'
          color: '#cccccc'
          permissions:
            - modify: false
              unpublish: false
              delete: false
        !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::IMPORTED_DISPLAYED->value:
          label: 'Imported and Displayed'
          color: '#ffcc00'
          permissions:
            - modify: true
              unpublish: false
              delete: true
        !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::CATEGORY_AUTO_ASSIGNED->value:
          label: 'Category Auto Assigned'
          color: '#ffcc00'
          permissions:
            - modify: true
              unpublish: false
              delete: true
        !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::ENRICHED->value:
          label: 'Enriched'
          color: '#ffd700'
          permissions:
            - modify: true
              unpublish: false
              delete: true
        !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::CATEGORY_MANUAL_ASSIGNED->value:
          label: 'Category Manual Assigned'
          color: '#ffd700'
          permissions:
            - modify: true
              unpublish: false
              delete: true
        !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::MEDIA_ASSIGNED->value:
          label: 'Media Assigned'
          color: '#ffd700'
          permissions:
            - modify: true
              unpublish: false
              delete: true
        !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::PENDING_APPROVAL->value:
          label: 'Pending Approval'
          color: '#ffa500'
          permissions:
            - modify: false
              unpublish: false
              delete: false
        !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::APPROVED->value:
          label: 'Approved'
          color: '#00cc00'
          permissions:
            - modify: false
              unpublish: true
              delete: false
        !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::REJECTED->value:
          label: 'Rejected'
          color: '#e74c3c'
          permissions:
            - modify: false
              unpublish: false
              delete: false
        !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::PUBLISHED->value:
          label: 'Published'
          color: '#006600'
          permissions:
            - modify: false
              unpublish: true
              delete: false
        !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::EXPORTED->value:
          label: 'Exported'
          color: '#006600'
          permissions:
            - modify: false
              unpublish: true
              delete: false
        !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::COMPLIANCE_SENT->value:
          label: 'Compliance Sent'
          color: '#006600'
          permissions:
            - modify: false
              unpublish: true
              delete: false
        !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::COMPLIANCE_APPROVED->value:
          label: 'Compliance Approved'
          color: '#006600'
          permissions:
            - modify: false
              unpublish: true
              delete: false
        !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::SAP_UPDATED_DISPLAYED->value:
          label: 'SAP Updated Displayed'
          color: '#99ccff'
          permissions:
            - modify: false
              unpublish: false
              delete: false
        !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::SAP_AUTO_UPDATED->value:
          label: 'SAP Auto Updated'
          color: '#99ccff'
          permissions:
            - modify: false
              unpublish: false
              delete: false
        !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::DRAFT_FOR_UPDATE->value:
          label: 'Draft for Update'
          color: '#ffcc00'
          permissions:
            - modify: true
              unpublish: false
              delete: true
        !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::UPDATED_ENRICHED->value:
          label: 'Updated Enriched'
          color: '#ffd700'
          permissions:
            - modify: true
              unpublish: false
              delete: true
        !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::UPDATED_PENDING_APPROVAL->value:
          label: 'Updated Pending Approval'
          color: '#ffa500'
          permissions:
            - modify: false
              unpublish: false
              delete: false
        !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::ARCHIVED->value:
          label: 'Archived'
          color: '#ff4444'
          permissions:
            - modify: false
              unpublish: false
              delete: true
        !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::EMERGENCY_UNPUBLISHED->value:
          label: 'Emergency Unpublished'
          color: '#ff0000'
          permissions:
            - modify: false
              unpublish: false
              delete: true
      transitions:
        !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowTransition::DISPLAY_IMPORTED->value:
          from: ['SAP']
          to: !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::IMPORTED_DISPLAYED->value
          options:
            label: 'Display Imported Product'
        !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowTransition::AUTO_ASSIGN_CATEGORY->value:
          from: !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::IMPORTED_DISPLAYED->value
          to: !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::CATEGORY_AUTO_ASSIGNED->value
          options:
            label: 'Assign External Category Automatically'
        !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowTransition::ENRICH_PRODUCT->value:
          from: !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::CATEGORY_AUTO_ASSIGNED->value
          to: !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::ENRICHED->value
          options:
            label: 'Enrich Marketing Text Fields'
        !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowTransition::MANUAL_ASSIGN_CATEGORY->value:
          from: !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::ENRICHED->value
          to: !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::CATEGORY_MANUAL_ASSIGNED->value
          options:
            label: 'Assign External Category (Manual)'
        !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowTransition::ASSIGN_MEDIA->value:
          from: [!php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::ENRICHED->value, !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::CATEGORY_MANUAL_ASSIGNED->value]
          to: !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::MEDIA_ASSIGNED->value
          options:
            label: 'Select Media and Define Sequence'
        !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowTransition::SUBMIT_FOR_APPROVAL->value:
          from: [!php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::ENRICHED->value, !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::CATEGORY_MANUAL_ASSIGNED->value, !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::MEDIA_ASSIGNED->value]
          to: !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::PENDING_APPROVAL->value
          options:
            label: 'Submit for Approval'
        !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowTransition::APPROVE_PRODUCT->value:
          from: !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::PENDING_APPROVAL->value
          to: !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::APPROVED->value
          options:
            label: 'Approve Product'
        !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowTransition::REJECT_PRODUCT->value:
          from: !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::PENDING_APPROVAL->value
          to: !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::REJECTED->value
          options:
            label: 'Reject Product'
            !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowContext::NOTES->value:
              title: 'Reason for Rejection'
              commentEnabled: true
              commentRequired: true
        !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowTransition::RETURN_TO_ENRICHMENT->value:
          from: !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::REJECTED->value
          to: !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::ENRICHED->value
          options:
            label: 'Return to Enrichment'
        !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowTransition::PUBLISH_PRODUCT->value:
          from: !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::APPROVED->value
          to: !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::PUBLISHED->value
          options:
            label: 'Set to Published Status'
        !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowTransition::EXPORT_PRODUCT->value:
          from: !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::PUBLISHED->value
          to: !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::EXPORTED->value
          options:
            label: 'Export to Outbound Channels'
        !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowTransition::EXPORT_TO_COMPLIANCE->value:
          from: [!php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::ENRICHED->value, !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::CATEGORY_MANUAL_ASSIGNED->value, !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::MEDIA_ASSIGNED->value]
          to: !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::COMPLIANCE_SENT->value
          options:
            label: 'Export Data to ComplianceQuest'
        !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowTransition::COMPLIANCE_APPROVE->value:
          from: !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::COMPLIANCE_SENT->value
          to: !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::COMPLIANCE_APPROVED->value
          options:
            label: 'ComplianceQuest Processing Complete'
        !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowTransition::SYNC_FROM_COMPLIANCE->value:
          from: !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::COMPLIANCE_APPROVED->value
          to: !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::PUBLISHED->value
          options:
            label: 'Synchronize from ComplianceQuest'
        !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowTransition::DISPLAY_SAP_UPDATED->value:
          from: ['SAP']
          to: !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::SAP_UPDATED_DISPLAYED->value
          options:
            label: 'Display SAP Updated Product'
        !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowTransition::UPDATE_SAP_DATA_AUTOMATICALLY->value:
          from: !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::SAP_UPDATED_DISPLAYED->value
          to: !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::SAP_AUTO_UPDATED->value
          options:
            label: 'Update SAP Data Automatically'
        !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowTransition::EXPORT_SAP_UPDATED->value:
          from: !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::SAP_AUTO_UPDATED->value
          to: !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::EXPORTED->value
          options:
            label: 'Export SAP Updated Product'
        !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowTransition::SET_TO_DRAFT_FOR_UPDATE->value:
          from: !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::PUBLISHED->value
          to: !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::DRAFT_FOR_UPDATE->value
          options:
            label: 'Set to Draft for Update'
        !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowTransition::UPDATE_PRODUCT_DATA->value:
          from: !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::DRAFT_FOR_UPDATE->value
          to: !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::UPDATED_ENRICHED->value
          options:
            label: 'Update Product Data/External Categories/Assets'
        !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowTransition::SUBMIT_UPDATED_FOR_APPROVAL->value:
          from: !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::UPDATED_ENRICHED->value
          to: !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::UPDATED_PENDING_APPROVAL->value
          options:
            label: 'Submit Updated for Approval'
        !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowTransition::APPROVE_UPDATED_PRODUCT->value:
          from: !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::UPDATED_PENDING_APPROVAL->value
          to: !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::APPROVED->value
          options:
            label: 'Approve Updated Product'
        !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowTransition::REJECT_UPDATED_PRODUCT->value:
          from: !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::UPDATED_PENDING_APPROVAL->value
          to: !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::DRAFT_FOR_UPDATE->value
          options:
            label: 'Reject Updated Product'
            !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowContext::NOTES->value:
              title: 'Reason for Rejection'
              commentEnabled: true
              commentRequired: true
        !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowTransition::PUBLISH_UPDATED_PRODUCT->value:
          from: !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::APPROVED->value
          to: !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::PUBLISHED->value
          options:
            label: 'Publish Updated Product'
        !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowTransition::EXPORT_UPDATED_PRODUCT->value:
          from: !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::PUBLISHED->value
          to: !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::EXPORTED->value
          options:
            label: 'Export Updated Product'
        !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowTransition::EXPORT_UPDATED_TO_COMPLIANCE->value:
          from: !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::UPDATED_ENRICHED->value
          to: !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::COMPLIANCE_SENT->value
          options:
            label: 'Export Updated Data to ComplianceQuest'
        !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowTransition::SYNC_UPDATED_FROM_COMPLIANCE->value:
          from: !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::COMPLIANCE_APPROVED->value
          to: !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::PUBLISHED->value
          options:
            label: 'Synchronize Updated from ComplianceQuest'
        !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowTransition::ARCHIVE_PRODUCT->value:
          from: !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::PUBLISHED->value
          to: !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::ARCHIVED->value
          options:
            label: 'Archive Product'
            !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowContext::NOTES->value:
              title: 'Reason for Archiving'
              commentEnabled: true
              commentRequired: true
        !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowTransition::MARK_AS_ARCHIVED->value:
          from: [!php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::EXPORTED->value, !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::SAP_AUTO_UPDATED->value]
          to: !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::ARCHIVED->value
          options:
            label: 'Mark Product as Archived'
            !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowContext::NOTES->value:
              title: 'Reason for Archiving'
              commentEnabled: true
              commentRequired: true
        !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowTransition::REACTIVATE_PRODUCT->value:
          from: !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::ARCHIVED->value
          to: !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::DRAFT_FOR_UPDATE->value
          options:
            label: 'Reactivate Product'
        !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowTransition::EMERGENCY_UNPUBLISH->value:
          from: !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::PUBLISHED->value
          to: !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowPlace::EMERGENCY_UNPUBLISHED->value
          options:
            label: 'Emergency Unpublish Product'
            !php/enum App\Enum\ProductManagement\ProductApprovalWorkflowContext::NOTES->value:
              title: 'Reason for Emergency Unpublish'
              commentEnabled: true
              commentRequired: true
      supports:
        - 'Pimcore\Model\DataObject\UniProductBase'
