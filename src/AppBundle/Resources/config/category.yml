parameters:
  # Csv header information
  sheet:
    columnName: ['code', 'level', 'description','attributeList']
    lastColName: 'E'
  # Root information
  root:
    type: 'dataObject'
    subType:  'object'
    fullPath: '/Master List/SIOP Master List/SIOP Engineered Products'
    id: 2
  # SIOP code length for each level
  codeLength:
    1:  2
    2:  4
    3:  4
    4:  3
    5:  3
    6:  2
  # SIOP full code length for each level
  levelLength:
    1:  2
    2:  6
    3:  10
    4:  13
    5:  16
    6:  18
  # Valid Categories for import
  validCategories:
    'Industrial House': 1000
    'Hydraulics': 1500
    'PTP':  3000
    'Yarn': 1700
    'Fabric': 1800
    'Compound': 1900
    'Air Springs': 5000
    'Auto Hose': 6000
    'Misc. Other Materials': 9700
    'Literature': 9800
    'Obsolete': 9999
  # Valid Business Unit
  businessUnit:
    1000: 'IFS'
    1500: 'IFS'
    1700: ''
    1800: ''
    1900: ''
    5000: ''
    6000: ''
    9700: ''
    9800: ''
    9999: ''
    3000: 'PTG'
  # Related classification mapping on list of levels
  relatedClsfcnLvl: [4, 6]
  # SIOP relation field names in productClass
  # these fields are managed in config to keep the system from performance issue
  siopRelationFieldsInProductClass: ['SIOPLevel1', 'SIOPLevel2', 'SIOPLevel3', 'SIOPLevel4', 'SIOPLevel5', 'SIOPLevel6']
  # Max SIOP Level For Business Unit
  businessUnitMaxLevel:
    'IFS':  4
    'PTG':  6