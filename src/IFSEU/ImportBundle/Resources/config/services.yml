    # Event Listener 
    IFSEU\ImportBundle\EventListener\ObjectListener:
        tags:
            - { name: kernel.event_listener, event: pimcore.dataobject.preUpdate, method: preUpdate }

    # Helpers
    ifs_eu_import.common_helper:
