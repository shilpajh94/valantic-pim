services:
    # default configuration for services in *this* file
    _defaults:
        # automatically injects dependencies in your services
        autowire: true
        # automatically registers your services as commands, event subscribers, etc.
        autoconfigure: true
        # this means you cannot fetch services directly from the container via $container->get()
        # if you need to do this, you can override this setting on individual services
        public: false

    # controllers are imported separately to make sure they're public
    # and have a tag that allows actions to type-hint services
    PimDataPostBundle\Controller\:
        resource: '../src/Controller'
        public: true
        tags: ['controller.service_arguments']

# add more services, or override services that need manual wiring
#    PimDataPostBundle\ExampleClass:
#        arguments:
#            - "@service_id"
#            - "plain_value"
#            - "%parameter%"
    PimDataPostBundle\Services\TokenAuthService:
        public: true
    
    PimDataPostBundle\Command\SampleTestCommand:
        tags:
            - { name: 'console.command', command: 'conti:datapost:sample-test-command' }
    
    PimDataPostBundle\Command\ConnectionTestCommand:
        tags:
            - { name: 'console.command', command: 'conti:datapost:connection-test-command' }

    PimDataPostBundle\Command\B2CConnectionTestCommand:
        tags:
            - { name: 'console.command', command: 'conti:datapost:b2c_connection-test-command' }            

    PimDataPostBundle\Command\CreateB2CTableCommand:
        tags:
            - { name: 'console.command', command: 'conti:datapost:create-b2c-table' }

    PimDataPostBundle\Command\CreateB2BTableCommand:
        tags:
            - { name: 'console.command', command: 'conti:datapost:create-b2b-table' }

    PimDataPostBundle\Services\UtilService:
        public: true
    
    PimDataPostBundle\EventListener\AssetListener:
        tags:
            - { name: kernel.event_listener, event: pimcore.asset.postDelete, method: onPostAssetDelete }
    
    PimDataPostBundle\EventListener\ObjectListener:
        tags:
            - { name: kernel.event_listener, event: pimcore.dataobject.preAdd, method: onPreAdd }

    PimDataPostBundle\Command\PimDataPostCommand:
        tags:
            - { name: 'console.command', command: 'conti:datapost:pim-data-post-command' }

    PimDataPostBundle\Command\InitialLoadCommand\B2BInitialLoadCommand:
        tags:
            - { name: 'console.command', command: 'conti:datapost:b2b-initial-load-command' }   
            
    PimDataPostBundle\Command\APIRequestEntityTableArchivalCommand:
        tags:
            - { name: 'console.command', command: 'conti:datapost:api-request-entity-table-archival-command' }
                
    PimDataPostBundle\Command\InitialLoadCommand\B2CInitialLoadCommand:
        tags:
            - { name: 'console.command', command: 'conti:datapost:b2c-initial-load-command' }  
