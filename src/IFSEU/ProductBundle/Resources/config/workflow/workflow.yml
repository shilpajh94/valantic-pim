                methods:
                    - checkForMandatoryValidation

        send_to_marcom_again:
            condition:
                methods:
                    - checkForMandatoryValidation

        in_marcom_edit_after_publish:
            condition:
                methods:
                    - checkForMandatoryValidation

        in_pm_review_after_editor_edit:
            condition:
                methods:
                    - checkForMandatoryValidation

        in_marcom_edit_after_editor_fixes:
            condition:
                methods:
                    - checkForMandatoryValidation

        in_pm_review_after_editor:
            condition:
                methods:
                    - checkForMandatoryValidation
                    
        in_pm_review:
            action: 
                published: true
            condition:
                methods:
                    - checkForMandatoryValidation
                    - checkIfParentUnPublished

        approved:
            action: 
                published: true
            condition:
                methods:
                    - checkForMandatoryValidation
                    - checkIfParentUnPublished