services:
    # default configuration for services in *this* file
    _defaults:
        # automatically injects dependencies in your services
        autowire: true
        # automatically registers your services as commands, event subscribers, etc.
        autoconfigure: true
        # this means you cannot fetch services directly from the container via $container->get()
        # if you need to do this, you can override this setting on individual services
        public: false

    # controllers are imported separately to make sure they're public
    # and have a tag that allows actions to type-hint services
    SSOIntegrationBundle\Controller\:
        resource: '../../Controller'
        public: true
        tags: ['controller.service_arguments']

# add more services, or override services that need manual wiring
#    SSOIntegrationBundle\ExampleClass:
#        arguments:
#            - "@service_id"
#            - "plain_value"
#            - "%parameter%"

    saml_response_service:
        class: SSOIntegrationBundle\Service\ResponseService
        public: true

    # SSOIntegrationBundle\Service\ResponseService: '@saml_response_service'

    saml_container_service:
        class: SSOIntegrationBundle\Service\ContainerService
        public: true

    SSOIntegrationBundle\Service\ContainerService: '@saml_container_service'  

    saml_user_service:
        class: SSOIntegrationBundle\Service\UserService
        public: true
        arguments: ['%saml_sp_config%']

    # SSOIntegrationBundle\Service\UserService: '@saml_user_service'

    SSOIntegrationBundle\Service\RequestService:
        public: true
        autowire: true
        arguments: ['%saml_sp_config%', '%saml_idp_config%']


    SSOIntegrationBundle\Service\ResponseService:
        autowire: true

    SSOIntegrationBundle\Service\UserService:
        autowire: true
        arguments: ['%saml_sp_config%']

