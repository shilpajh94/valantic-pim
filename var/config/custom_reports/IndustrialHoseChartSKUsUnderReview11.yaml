pimcore_custom_reports:
    definitions:
        IndustrialHoseChartSKUsUnderReview11:
            name: IndustrialHoseChartSKUsUnderReview11
            sql: ''
            dataSourceConfig:
                -
                    sql: "SELECT count(o1.`id`) AS `# of SKUs`, \nCASE\n    WHEN  w.`place` = 'enrich' OR w.`place` is null  THEN 'Enrich Product'\n    WHEN  w.`place` = 'review_content' THEN 'Review Enriched Data'\n    WHEN  w.`place` = 'unpublished' THEN 'Product Unpublished'\n    WHEN  w.`place` = 'accepted' THEN 'Product Published'\n    ELSE \"\"\nEND AS `Status` "
                    from: "FROM object_1 o1 \nleft JOIN element_workflow_state w ON o1.oo_id = w.cid "
                    where: "WHERE o1.siopFullCode LIKE '041000%'"
                    groupby: 'GROUP BY `Status`'
                    type: sql
            columnConfiguration:
                -
                    name: '# of SKUs'
                    display: true
                    export: true
                    order: true
                    width: ''
                    label: ''
                    id: extModel1371-1
                -
                    name: Status
                    display: true
                    export: true
                    order: true
                    width: ''
                    label: ''
                    id: extModel1371-2
            niceName: 'Chart - SKUs Workflow Status 11'
            group: 'Industrial Hose'
            groupIconClass: ''
            iconClass: ''
            menuShortcut: false
            reportClass: ''
            chartType: pie
            pieColumn: '# of SKUs'
            pieLabelColumn: Status
            xAxis: null
            yAxis: {  }
            modificationDate: 1708321094
            creationDate: 1708320971
            shareGlobally: true
            sharedUserNames: {  }
            sharedRoleNames: {  }
