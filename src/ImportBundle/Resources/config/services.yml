services:
    # default configuration for services in *this* file
    _defaults:
        # automatically injects dependencies in your services
        autowire: true
        # automatically registers your services as commands, event subscribers, etc.
        autoconfigure: true
        # this means you cannot fetch services directly from the container via $container->get()
        # if you need to do this, you can override this setting on individual services
        public: false

    # controllers are imported separately to make sure they're public
    # and have a tag that allows actions to type-hint services
    ImportBundle\Controller\:
        resource: '../../Controller'
        public: true
        tags: ['controller.service_arguments']

# add more services, or override services that need manual wiring
#    ImportBundle\ExampleClass:
#        arguments:
#            - "@service_id"
#            - "plain_value"
#            - "%parameter%"

    # this service will hook the rest services defined in commands.yml
    import.lookup_service:
        class: ImportBundle\Services\Lookup
        public: true

    # this service contain the logic to import siop record
    import.category_service:
        class: ImportBundle\Services\Model\CategoryModel
        public: true

    # this service will validate each single row which has to be import and have some 
    # logical code. eg: get list of level
    import.category_validator_service:
        class: ImportBundle\Services\Validator\Category
        public: true

    # this service contain the logic to import sales material master
    import.sales_material_master_import_service:
        class: ImportBundle\Services\Model\SalesMaterialModel
        public: true

    # this service contain the logic to import plant material master
    import.plant_material_master_import_service:
        class: ImportBundle\Services\Model\PlantMaterialModel
        public: true
    # this service contain the logic to import siop record
    import.product_service:
        class: ImportBundle\Services\Model\ProductModel
        public: true
        
    import.product_sql_service:
        class: ImportBundle\Services\Model\ProductSQLModel
        public: true
    # this service will validate each single row which has to be import and have some 
    # logical code. eg: get list of level
    import.product_validator_service:
        class: ImportBundle\Services\Validator\Product
        public: true
        
    ImportBundle\Command\SapPriceImportCommand:
        tags:
            - { name: 'console.command', command: 'conti:sap:pice-import' }
            
    import.sap_price_import:
        class: ImportBundle\Services\Model\PriceImportModel
        public: true
        
    import.sap_price_import_table_helper:
        class: ImportBundle\Model\Import\Price
        public: true

    ImportBundle\Command\CopyAssetCommand:
        tags:
            - { name: 'console.command', command: 'conti:copy-asset' }
            
    ImportBundle\Command\AssetImportCommand:
        tags:
            - { name: 'console.command', command: 'conti:asset-import' }

    ImportBundle\OneTimeImportCommand\AssociateNomenclatureToProductCommand:
        tags:
            - { name: 'console.command', command: 'onetime-import:assoc-nomenclature-product' }


    ImportBundle\OneTimeImportCommand\PopulateHydFittingTableNameCommand:
        tags:
            - { name: 'console.command', command: 'onetime-import:populate-hyd-fitting-table-name' }
            
    import.asset_import_service:
        class: ImportBundle\Services\Model\AssetImportModel
        public: true
